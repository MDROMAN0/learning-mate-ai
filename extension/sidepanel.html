<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Learning Mate AI</title><link rel="icon" href="icon48.png">
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1a1f2b;--line:#262c3a;--text:#f2f4f8;--text2:#c3c9d6;--muted:#929bae;
  --brand:#7c5cff;--brand2:#22d3ee;--soft:rgba(124,92,255,.16);--chip:#c9bcff;--ok:#22c55e;--bad:#f43f5e;--warn:#f59e0b}
:root[data-theme=light]{--bg:#f5f6fa;--panel:#fff;--panel2:#eef0f6;--line:#d9dde8;--text:#10131a;--text2:#333a49;--muted:#5d6678;
  --soft:rgba(124,92,255,.12);--chip:#5b3fe0;--ok:#15803d;--bad:#be123c;--warn:#b45309}
*{box-sizing:border-box}
html,body{height:100%}
body{font:14.5px/1.6 "Inter","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;color:#fff}
header b{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){header{gap:5px;padding:8px}header .ic{padding:4px 7px}}
.ic{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;min-height:30px}
.vid{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.vid img{width:84px;height:47px;object-fit:cover;border-radius:6px;background:var(--panel2);flex:none}
.vid .tt{font-weight:650;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--chip)}
.pill.ok{background:rgba(34,197,94,.14);color:var(--ok)} .pill.bad{background:rgba(244,63,94,.14);color:var(--bad)} .pill.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;color:var(--muted);font-weight:650}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--brand)}
main{flex:1;overflow-y:auto;padding:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.muted{color:var(--muted);font-size:12.5px}
.btn{padding:9px 12px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;font-weight:650}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:4px 0 8px}
.bub{background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;padding:7px 12px;border-radius:12px 12px 3px 12px;margin:4px 0 8px auto;width:fit-content;max-width:88%}
.steps{display:flex;gap:4px;margin:2px 0 8px}
.steps span{flex:1;text-align:center;font-size:10.5px;padding:3px 2px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.steps span.done{background:rgba(34,197,94,.14);color:var(--ok)}
.chip{display:inline-block;border:0;padding:0 7px;border-radius:6px;background:var(--soft);color:var(--chip);font:600 11.5px ui-monospace,Consolas,monospace;margin:0 2px}
.chip:hover{outline:1px solid var(--brand)}
h3{margin:4px 0;font-size:15px} h4{margin:10px 0 2px;color:var(--brand2);font-size:13px}
:root[data-theme=light] h4{color:#0e7490}
ul{margin:0;padding-left:18px} li{margin:4px 0}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.14)} .opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.12)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);animation:s .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
footer{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
.row{display:flex;gap:6px;align-items:center}
.tog{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-top:6px}
[hidden]{display:none!important}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.tabs button{font-size:13px;padding:9px 2px}
.hide{display:none!important}
:root{--bg2:#10131a;--line2:#323a4c;--brandSoft:rgba(124,92,255,.14);--font:"Inter","Hind Siliguri",system-ui,sans-serif}
:root[data-theme=light]{--bg2:#eef0f5;--line2:#d3d8e3;--brandSoft:rgba(124,92,255,.10)}
main.nbmode{padding:0;overflow:hidden;display:flex;flex-direction:column}
.nbpane{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.nb-top{padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.ntool{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.ntool button{min-width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font:600 13px var(--font);display:grid;place-items:center;padding:0 5px}
.ntool button:hover{background:var(--panel2);border-color:var(--line2)} .ntool button.on{background:var(--brandSoft);border-color:var(--brand)}
.ntool .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.ntool .sw{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--line2);margin:0 1px} .ntool .sw.on{border-color:var(--text)}
.nb-hint{font-size:11.5px;margin-top:2px;min-height:16px}
.nbdd{position:relative;display:inline-flex}
.nb-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nb-menu.col{flex-direction:column;min-width:190px;left:0}
.nb-menu.col button{display:flex!important;justify-content:flex-start;gap:8px;width:100%;height:34px;padding:0 10px;font-weight:600;white-space:nowrap}
#nbAI{display:inline-flex!important;gap:5px;color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.mic.rec{color:#fff!important;background:var(--bad)!important;border-color:var(--bad)!important;animation:micp 1s infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px rgba(244,63,94,.25)}}

.nb-scroll{flex:1;overflow:auto;padding:8px;min-height:0}
.nb-page{position:relative;width:100%;min-height:500px;border:1px solid var(--line);border-radius:12px;cursor:text;background-color:var(--bg2);background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:20px 20px}
.nb-page.drawmode{cursor:crosshair}
#nbInk{position:absolute;left:0;top:0;width:100%;z-index:5;pointer-events:none;border-radius:12px;touch-action:none}
.nb-it{position:absolute;z-index:2}
.nb-bar{position:absolute;top:-26px;left:0;display:none;gap:4px;align-items:center}
.nb-bar .nb-grip,.nb-bar .nb-del{height:22px;min-width:22px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;justify-content:center;background:var(--panel);border:1px solid var(--line2);color:var(--text2);cursor:grab;padding:0 6px;font:600 11px var(--font)}
.nb-bar .nb-grip{background:var(--brand);border-color:var(--brand);color:#fff} .nb-bar .nb-del{cursor:pointer} .nb-bar .nb-del:hover{color:var(--bad)}
.nb-it:hover .nb-bar,.nb-it.sel .nb-bar{display:flex} .drawmode .nb-bar,.drawmode .nb-rs{display:none!important}
.nb-txt{outline:none;min-height:24px;padding:3px 6px;border-radius:8px;border:1px dashed transparent;font-size:13.5px;line-height:1.55;color:var(--text)}
.nb-txt:focus,.nb-it.sel .nb-txt{border-color:var(--line2);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.nb-txt h3{margin:3px 0;font-size:15px} .nb-txt ul{margin:2px 0;padding-left:18px} .nb-txt p{margin:2px 0} .nb-txt img{max-width:100%}
.nb-img{cursor:move} .nb-img img{width:100%;border-radius:8px;display:block;border:1px solid var(--line2);user-select:none;-webkit-user-drag:none}
.nb-it.sel img{outline:2px solid var(--brand);outline-offset:2px}
.nb-rs{position:absolute;right:-9px;bottom:14px;width:18px;height:18px;border-radius:4px;background:var(--brand);cursor:nwse-resize;display:none;border:2px solid #fff}
.nb-it:hover .nb-rs,.nb-it.sel .nb-rs{display:block}
.nb-cap{font-size:11.5px;color:var(--muted);margin-top:4px} .nb-ts{cursor:grab} .nb-lbl{font-size:12.5px;color:var(--text2)}
.tsn{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--chip);font:600 11.5px ui-monospace,Consolas,monospace;cursor:pointer;text-decoration:none}
.nb-page.printing{background:#fff!important;border-color:#fff} .printing .nb-bar,.printing .nb-rs{display:none!important}
.printing .nb-txt{color:#111!important;border-color:transparent!important;background:transparent!important}
.nb-ask{display:flex;gap:6px;align-items:center;padding:8px;border-top:1px solid var(--line);background:var(--panel);flex:none}
#nbExplain{flex:none;white-space:nowrap} #nbExplain:disabled{opacity:.45} #nbExplain.ready{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.nb-card{position:absolute;right:8px;left:8px;bottom:56px;max-height:65%;overflow:auto;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.nb-card h3{margin:0 0 4px;font-size:14.5px} .nb-card .sum{color:var(--text2);margin:0 0 8px;font-size:13.5px}
.nb-card h4{margin:8px 0 2px;font-size:13px} .nb-card ul{margin:0;padding-left:18px;font-size:13.5px}
.nb-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px} .nb-card .hd .sp{flex:1} .nb-card .q{font-size:12px;color:var(--muted);margin-bottom:6px} .nb-card .acts{display:flex;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--chip)}
.badge.ok{background:rgba(34,197,94,.14);color:var(--ok)} .badge.bad{background:rgba(244,63,94,.14);color:var(--bad)} .badge.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.shimmer{height:12px;border-radius:6px;background:var(--panel2);margin:6px 0}
.btn.pri{background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;border:0}
.ico{flex:none;vertical-align:-2px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90;animation:fsh .35s}@keyframes fsh{0%{opacity:.5}to{opacity:0}}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:6px 12px;border-radius:10px;font-size:12.5px;z-index:99;max-width:90%;text-align:center}
  .selmode{cursor:crosshair} .selmode .nb-it{pointer-events:none}
  .nb-it.msel{outline:2px dashed var(--brand);outline-offset:3px;border-radius:8px}
  .nb-selbox{position:absolute;z-index:8;border:1.5px dashed var(--brand);background:rgba(124,92,255,.08);border-radius:6px;cursor:move}
  .nb-selbar{position:absolute;top:-36px;left:0;display:flex;gap:4px}
  .nb-selbar button{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--bad);background:var(--panel);color:var(--bad);font:600 12px var(--font);cursor:pointer;white-space:nowrap}
  .miclang{height:22px;min-width:30px;margin-left:-4px;padding:0 6px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text2);font:700 11px var(--font);cursor:pointer;align-self:center}
  .miclang:hover{border-color:var(--brand);color:var(--text)}
</style></head><body>
<header>
  <img class="logo" src="lib/logo.svg" alt="" aria-hidden="true"><b>Learning Mate AI</b>
  <button class="ic" id="langBtn" type="button"></button>
  <button class="ic" id="themeBtn" type="button" aria-label="Dark / light"></button>
  <label class="ic" id="docBtn" data-tt="docBtn" style="display:grid;place-items:center;cursor:pointer">📄<input type="file" id="docFile" accept=".pdf,.pptx" hidden></label>
  <button class="ic" id="gear" type="button" aria-label="Settings" aria-expanded="false">⚙</button>
</header>

<section class="card" id="settings" hidden style="margin:10px 12px 0">
  <label class="muted" for="backend" data-t="server"></label>
  <input class="in" id="backend" placeholder="https://learning-mate-ai.onrender.com">
  <div id="loginBox">
    <label class="muted" for="email" data-t="email"></label><input class="in" id="email" type="email" autocomplete="username">
    <label class="muted" for="pass" data-t="password"></label><input class="in" id="pass" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn" type="button" data-t="login"></button>
  </div>
  <div id="meBox" hidden class="row"><span class="pill ok" id="meName"></span><button class="ic" id="logoutBtn" type="button" data-t="logout"></button></div>
  <div class="muted" id="setMsg" role="status" style="margin-top:6px"></div>
</section>

<div class="vid">
  <img id="thumb" alt="" hidden><span id="docIcon" hidden style="font-size:30px;line-height:1">📄</span>
  <div style="flex:1;min-width:0"><div class="tt" id="vtitle"></div><span class="pill" id="vstate" role="status"></span></div>
  <button class="btn" id="prep" type="button" hidden data-t="prepare"></button>
  <button class="ic" id="docExit" type="button" hidden data-tt="backToVideo">✕</button>
</div>

<div class="tabs" role="tablist">
  <button role="tab" id="t_chat" aria-selected="true" data-tab="chat" data-t="chat"></button>
  <button role="tab" id="t_sum" aria-selected="false" data-tab="sum" data-t="summary"></button>
  <button role="tab" id="t_quiz" aria-selected="false" data-tab="quiz" data-t="quiz"></button>
  <button role="tab" id="t_notes" aria-selected="false" data-tab="notes" data-t="notes"></button>
</div>

<main id="main">
  <div id="p_chat" aria-live="polite"></div>
  <div id="p_sum" hidden></div>
  <div id="p_quiz" hidden></div>
  <div id="p_notes" class="hide nbpane">
    <div class="nb-top">
      <div class="ntool" id="nbTools">
        <button type="button" data-tool="type" class="on" data-tt="nbType"><i data-i="type" data-s="15"></i></button><button type="button" data-tool="select" data-tt="nbSelect"><i data-i="select" data-s="15"></i></button>
        <button type="button" data-tool="pen" data-tt="pen"><i data-i="pen" data-s="15"></i></button>
        <button type="button" data-tool="marker" data-tt="marker"><i data-i="marker" data-s="15"></i></button>
        <button type="button" data-tool="eraser" data-tt="eraser"><i data-i="eraser" data-s="15"></i></button><span class="nbdd"><button type="button" id="nbShapeBtn" data-tt="nbShapes"><i data-i="shapes" data-s="15"></i></button><span class="nb-menu hide" id="nbShapes"><button type="button" data-tool="line" data-tt="nbLine"><i data-i="line" data-s="15"></i></button><button type="button" data-tool="arrow" data-tt="nbArrow"><i data-i="arrowd" data-s="15"></i></button><button type="button" data-tool="rect" data-tt="nbRect"><i data-i="rect" data-s="15"></i></button><button type="button" data-tool="ellipse" data-tt="nbEllipse"><i data-i="ellipse" data-s="15"></i></button></span></span>
        <span class="sep"></span>
        <span class="sw" data-col="#f2f4f8" style="background:#f2f4f8"></span><span class="sw on" data-col="#7c5cff" style="background:#7c5cff"></span><span class="sw" data-col="#22d3ee" style="background:#22d3ee"></span><span class="sw" data-col="#f43f5e" style="background:#f43f5e"></span><span class="sw" data-col="#22c55e" style="background:#22c55e"></span><span class="sw" data-col="#111827" style="background:#111827"></span>
        <input type="range" id="nbSize" aria-label="Pen size" min="1" max="20" value="3" style="width:64px">
        <span class="sep"></span>
        <button type="button" data-fmt="bold" title="Bold"><b>B</b></button><button type="button" data-fmt="italic" title="Italic"><i style="font-style:italic;font-family:serif">I</i></button><button type="button" data-fmt="h" title="Heading"><b>H</b></button><button type="button" data-fmt="list" title="List"><i data-i="list" data-s="15"></i></button><button type="button" data-fmt="hl" title="Highlight"><span style="background:rgba(250,204,21,.5);padding:0 5px;border-radius:3px;font-weight:700">A</span></button>
        <span class="sep"></span>
        <button type="button" id="nbTs" data-tt="tsBtn"><i data-i="clock" data-s="15"></i></button><button type="button" id="nbSnap" data-tt="ssBtn"><i data-i="camera" data-s="15"></i></button>
        <span class="sep"></span>
        <button type="button" id="nbUndo" data-tt="undo"><i data-i="undo" data-s="15"></i></button><button type="button" id="nbRedo" data-tt="redo"><i data-i="redo" data-s="15"></i></button><button type="button" id="nbClear" data-tt="clear"><i data-i="trash" data-s="15"></i></button><button type="button" id="nbClearAll" data-tt="nbClearAll"><i data-i="broom" data-s="15"></i></button>
        <button type="button" id="nbPdf" data-tt="exportPdf"><i data-i="download" data-s="15"></i></button><button type="button" id="nbShare" data-tt="shareT"><i data-i="share" data-s="15"></i></button>
        <span class="sep"></span><button type="button" id="nbZoomOut" data-tt="zoomOut"><i data-i="zout" data-s="15"></i></button><button type="button" id="nbZoomV" data-tt="zoomReset" style="font:600 11px var(--mono,monospace);min-width:40px">100%</button><button type="button" id="nbZoomIn" data-tt="zoomIn"><i data-i="zin" data-s="15"></i></button>
        <span class="sep"></span><span class="nbdd"><button type="button" id="nbAI" class="nbai" data-tt="nbAIT"><i data-i="sparkles" data-s="15"></i> <span data-t="nbAIBtn"></span></button><span class="nb-menu col hide" id="nbAIMenu"><button type="button" data-ai="summary"><i data-i="book" data-s="14"></i> <span data-t="nbAI_summary"></span></button><button type="button" data-ai="mindmap"><i data-i="map" data-s="14"></i> <span data-t="nbAI_mindmap"></span></button><button type="button" data-ai="flashcards"><i data-i="cards" data-s="14"></i> <span data-t="nbAI_flashcards"></span></button><button type="button" data-ai="quiz"><i data-i="quiz" data-s="14"></i> <span data-t="nbAI_quiz"></span></button></span></span>
      </div>
      <div class="nb-hint"><span class="muted" id="nSave"></span></div>
    </div>
    <div class="nb-scroll" id="nbScroll"><div class="nb-page" id="nbPage"><canvas id="nbInk"></canvas></div></div>
    <div class="nb-card hide" id="nbCard"></div>
    <div class="nb-ask">
      <button class="btn ghost sm" type="button" id="nbExplain" disabled data-t="nbExplain"></button>
      <button class="btn ghost sm mic" type="button" id="nbMic" data-tt="micT"><i data-i="mic" data-s="15"></i></button>
      <input class="in" id="nbQ" style="margin:0">
      <button class="btn sm" type="button" id="nbAskBtn" aria-label="Send">➤</button>
    </div>
  </div>
</main>

<footer id="composer">
  <div class="row">
    <button class="ic mic" id="qMic" type="button" data-tt="micT" style="height:38px"><i data-i="mic" data-s="15"></i></button>
    <input class="in" id="q" style="margin:0" aria-label="Question">
    <button class="btn" id="ask" type="button" data-t="ask"></button>
  </div>
  <label class="tog"><input type="checkbox" id="sp"> <span data-t="spoiler"></span></label>
</footer>
<div id="toast" class="hide" role="status"></div>
<script src="lib/i18n.js"></script>
<script src="lib/icons.js"></script>
<script src="sidepanel.js"></script>
<script src="lib/notebook.js"></script>
<script src="nb_glue.js"></script>
</body></html>
