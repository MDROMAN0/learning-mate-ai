<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Learning Mate AI</title>
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1a1f2b;--line:#262c3a;--text:#f2f4f8;--text2:#c3c9d6;--muted:#929bae;
  --brand:#7c5cff;--brand2:#22d3ee;--soft:rgba(124,92,255,.16);--chip:#c9bcff;--ok:#22c55e;--bad:#f43f5e;--warn:#f59e0b}
:root[data-theme=light]{--bg:#f5f6fa;--panel:#fff;--panel2:#eef0f6;--line:#d9dde8;--text:#10131a;--text2:#333a49;--muted:#5d6678;
  --soft:rgba(124,92,255,.12);--chip:#5b3fe0;--ok:#15803d;--bad:#be123c;--warn:#b45309}
*{box-sizing:border-box}
html,body{height:100%}
body{font:14.5px/1.6 "Inter","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;color:#fff}
header b{font-size:15px;flex:1}
.ic{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;min-height:30px}
.vid{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.vid img{width:84px;height:47px;object-fit:cover;border-radius:6px;background:var(--panel2);flex:none}
.vid .tt{font-weight:650;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--chip)}
.pill.ok{background:rgba(34,197,94,.14);color:var(--ok)} .pill.bad{background:rgba(244,63,94,.14);color:var(--bad)} .pill.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;color:var(--muted);font-weight:650}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--brand)}
main{flex:1;overflow-y:auto;padding:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.muted{color:var(--muted);font-size:12.5px}
.btn{padding:9px 12px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;font-weight:650}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:4px 0 8px}
.bub{background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;padding:7px 12px;border-radius:12px 12px 3px 12px;margin:4px 0 8px auto;width:fit-content;max-width:88%}
.steps{display:flex;gap:4px;margin:2px 0 8px}
.steps span{flex:1;text-align:center;font-size:10.5px;padding:3px 2px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.steps span.done{background:rgba(34,197,94,.14);color:var(--ok)}
.chip{display:inline-block;border:0;padding:0 7px;border-radius:6px;background:var(--soft);color:var(--chip);font:600 11.5px ui-monospace,Consolas,monospace;margin:0 2px}
.chip:hover{outline:1px solid var(--brand)}
h3{margin:4px 0;font-size:15px} h4{margin:10px 0 2px;color:var(--brand2);font-size:13px}
:root[data-theme=light] h4{color:#0e7490}
ul{margin:0;padding-left:18px} li{margin:4px 0}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.14)} .opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.12)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);animation:s .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
footer{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
.row{display:flex;gap:6px;align-items:center}
.tog{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-top:6px}
[hidden]{display:none!important}
</style></head><body>
<header>
  <div class="logo" aria-hidden="true">L</div><b>Learning Mate AI</b>
  <button class="ic" id="langBtn" type="button"></button>
  <button class="ic" id="themeBtn" type="button" aria-label="Dark / light"></button>
  <button class="ic" id="gear" type="button" aria-label="Settings" aria-expanded="false">⚙</button>
</header>

<section class="card" id="settings" hidden style="margin:10px 12px 0">
  <label class="muted" for="backend" data-t="server"></label>
  <input class="in" id="backend" placeholder="https://learning-mate-ai.onrender.com">
  <div id="loginBox">
    <label class="muted" for="email" data-t="email"></label><input class="in" id="email" type="email" autocomplete="username">
    <label class="muted" for="pass" data-t="password"></label><input class="in" id="pass" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn" type="button" data-t="login"></button>
  </div>
  <div id="meBox" hidden class="row"><span class="pill ok" id="meName"></span><button class="ic" id="logoutBtn" type="button" data-t="logout"></button></div>
  <div class="muted" id="setMsg" role="status" style="margin-top:6px"></div>
</section>

<div class="vid">
  <img id="thumb" alt="" hidden>
  <div style="flex:1;min-width:0"><div class="tt" id="vtitle"></div><span class="pill" id="vstate" role="status"></span></div>
  <button class="btn" id="prep" type="button" hidden data-t="prepare"></button>
</div>

<div class="tabs" role="tablist">
  <button role="tab" id="t_chat" aria-selected="true" data-tab="chat" data-t="chat"></button>
  <button role="tab" id="t_sum" aria-selected="false" data-tab="sum" data-t="summary"></button>
  <button role="tab" id="t_quiz" aria-selected="false" data-tab="quiz" data-t="quiz"></button>
</div>

<main>
  <div id="p_chat" aria-live="polite"></div>
  <div id="p_sum" hidden></div>
  <div id="p_quiz" hidden></div>
</main>

<footer id="composer">
  <div class="row">
    <input class="in" id="q" style="margin:0" aria-label="Question">
    <button class="btn" id="ask" type="button" data-t="ask"></button>
  </div>
  <label class="tog"><input type="checkbox" id="sp"> <span data-t="spoiler"></span></label>
</footer>
<script src="sidepanel.js"></script>
</body></html>
