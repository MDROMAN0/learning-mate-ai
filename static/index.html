<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Mate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<style>
  .app{display:grid;grid-template-columns:292px 1fr;height:calc(100vh - 55px)}
  .side{border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  .side .blk{padding:12px 14px 4px}
  .navl{display:flex;flex-direction:column;gap:2px;padding:10px 10px 4px}
  .navl button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--text2);font:600 14px var(--font);cursor:pointer;text-align:left}
  .navl button:hover{background:var(--panel)} .navl button.on{background:var(--brandSoft);color:var(--text)}
  .lib{flex:1;overflow:auto;padding:4px 10px 10px}
  .vc{display:flex;gap:10px;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s;margin-bottom:4px}
  .vc:hover{background:var(--panel)} .vc.on{background:var(--panel);border-color:var(--brand)}
  .vc img{width:92px;height:52px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
  .vc .tt{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vc .mm{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
  .hi{padding:10px 12px;border-radius:12px;cursor:pointer;font-size:14px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px}
  .hi:hover{border-color:var(--brand)} .hi .muted{font-size:12px}
  .me{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
  .meter{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px} .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
  .main{overflow:auto;min-height:0}
  .view{min-height:100%}
  .work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);height:100%;min-height:0}
  .left{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
  .right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
  .player{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:var(--shadow);flex:none}
  .player iframe,.player video,.player>div{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vtitle{font-size:18px;font-weight:750;line-height:1.35;margin:0}
  .tl{position:relative;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;cursor:pointer}
  .tl .cell{position:absolute;top:0;bottom:0;transition:background .4s}
  .tl .segm{position:absolute;top:3px;bottom:3px;border:2px solid #fff;border-radius:6px;box-shadow:0 0 12px rgba(255,255,255,.4)}
  .tl .needle{position:absolute;top:0;bottom:0;width:2px;background:var(--brand2);box-shadow:0 0 8px var(--brand2)}
  .tl .lbl{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
  .legend{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:4px}
  .tr{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .tc{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text2)}
  .tc:hover{background:var(--panel2)} .tc.now{background:var(--brandSoft);color:var(--text)}
  .tc .ts{font:600 12px var(--mono);color:var(--brand2);padding-top:2px}
  mark{background:rgba(250,204,21,.35);color:inherit;border-radius:3px;padding:0 1px}
  .tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
  .tabs button{border:0;background:transparent;color:var(--muted);padding:9px 12px;font:650 13.5px var(--font);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
  .pane{flex:1;overflow:auto;padding:16px;min-height:0}
  .msg{margin-bottom:16px} .msg.mine{display:flex;justify-content:flex-end}
  .bub{background:linear-gradient(135deg,var(--brand),#5b8cff);color:#fff;padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:85%;font-weight:500}
  .ans{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .ans h3{margin:0 0 6px;font-size:16.5px} .ans .sum{color:var(--text2);margin:0 0 10px}
  .ans h4{margin:12px 0 4px;font-size:14px;color:var(--brand2)} .ans ul{margin:0;padding-left:18px} .ans li{margin:5px 0}
  .ans .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .segs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .sgi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .sgi .play{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;border:0}
  .sgi video,.sgi audio{width:100%;max-height:220px;margin-top:6px;border-radius:8px;background:#000}
  .sgi details summary{cursor:pointer;font-size:12.5px;color:var(--brand2);margin-top:3px;list-style:none} .sgi details summary::-webkit-details-marker{display:none}
  .pipe{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pipe div{flex:1;padding:6px 8px;background:var(--panel2);border-right:1px solid var(--line);text-align:center} .pipe div:last-child{border-right:0}
  .pipe b{display:block;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)} .pipe span{font:600 12px var(--mono);color:var(--text)}
  .pipe.run div{animation:pl 1.2s infinite} .pipe.run div:nth-child(2){animation-delay:.2s}.pipe.run div:nth-child(3){animation-delay:.4s}.pipe.run div:nth-child(4){animation-delay:.6s}.pipe.run div:nth-child(5){animation-delay:.8s}
  @keyframes pl{50%{background:var(--brandSoft)}}
  .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .comp{border-top:1px solid var(--line);padding:12px;background:var(--panel);flex:none}
  .comp textarea{min-height:46px;max-height:140px}
  .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .sugg button{border:1px dashed var(--line2);background:transparent;color:var(--text2);border-radius:99px;padding:4px 10px;font:12.5px var(--font);cursor:pointer}
  .sugg button:hover{border-color:var(--brand);color:var(--text)}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:14px var(--font);cursor:pointer}
  .opt:hover{border-color:var(--brand)} .opt.right{background:var(--okSoft);border-color:var(--ok)} .opt.wrong{background:var(--badSoft);border-color:var(--bad)}
  .hero{max-width:920px;margin:0 auto;padding:7vh 24px 20px;text-align:center}
  .hero h1{font-size:46px;line-height:1.12;letter-spacing:-1.2px;margin:14px 0;background:linear-gradient(135deg,var(--text) 30%,var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--text2);font-size:17px;max-width:640px;margin:0 auto 26px}
  .bigin{display:flex;gap:8px;max-width:660px;margin:0 auto;padding:6px;border-radius:16px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow)}
  .bigin .in{border:0;background:transparent;font-size:16px} .bigin .in:focus{box-shadow:none}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px;text-align:left}
  .steps .card{position:relative;padding-top:20px}
  .steps .k{position:absolute;top:-12px;left:14px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font:700 12px var(--mono)}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin-top:14px}
  .feat .card b,.steps .card b{display:block;margin:4px 0}
  .prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px} .prog i{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--brand),var(--brand2));animation:pg 1.4s infinite ease-in-out}
  @keyframes pg{0%{margin-left:-35%}100%{margin-left:100%}}
  .bw{max-width:1180px;margin:0 auto;padding:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
  .yt{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .yt:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--shadow)}
  .yt .th{position:relative;aspect-ratio:16/9;background:var(--panel2)} .yt img{width:100%;height:100%;object-fit:cover;display:block}
  .yt .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font:600 11.5px var(--mono);padding:1px 6px;border-radius:5px}
  .yt .ix{position:absolute;left:8px;top:8px}
  .yt .bd{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1} .yt .tt{font-weight:650;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .yt .ch{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
  .yt .go{margin-top:auto;width:100%}
  .auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,rgba(124,92,255,.25),transparent),radial-gradient(900px 500px at 90% 90%,rgba(34,211,238,.18),transparent),var(--bg)}
  .auth .box{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
  .auth .logo{justify-content:center;margin-bottom:6px;font-size:22px} .auth .logo i{width:38px;height:38px;font-size:18px}
  .auth h2{text-align:center;margin:8px 0 2px;font-size:22px} .auth p{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px}
  .auth label{display:block;font-size:12.5px;color:var(--text2);margin:10px 0 4px;font-weight:600}
  .auth .btn.pri{width:100%;margin-top:16px;padding:11px}
  .auth .sw{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)} .auth .sw a{cursor:pointer}
  /* notebook: type + draw + screenshots on one page */
  .qact{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
  .nbpane{display:flex;flex-direction:column;padding:0}
  .nb-top{padding:8px 10px 6px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .ntool{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .ntool button{min-width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;font:600 13px var(--font);display:grid;place-items:center;padding:0 6px}
  .ntool button:hover{background:var(--panel2);border-color:var(--line2)} .ntool button.on{background:var(--brandSoft);border-color:var(--brand);color:var(--text)}
  .ntool .sep{width:1px;height:20px;background:var(--line);margin:0 3px} .ntool .sp{flex:1}
  .ntool .sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--line2);margin:0 1px} .ntool .sw.on{border-color:var(--text)}
  .nb-hint{font-size:11.5px;margin-top:4px}
  .nb-scroll{flex:1;overflow:auto;padding:14px;min-height:0}
  .nb-page{position:relative;width:100%;min-height:700px;border:1px solid var(--line);border-radius:14px;cursor:text;background-color:var(--bg2);background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:24px 24px}
  .nb-page.drawmode{cursor:crosshair}
  #nbInk{position:absolute;left:0;top:0;width:100%;z-index:5;pointer-events:none;border-radius:14px;touch-action:none}
  .nb-it{position:absolute;z-index:2}
  .nb-bar{position:absolute;top:-26px;left:0;display:none;gap:4px;align-items:center}
  .nb-bar .nb-grip,.nb-bar .nb-del{height:22px;min-width:22px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;justify-content:center;background:var(--panel);border:1px solid var(--line2);color:var(--text2);cursor:grab;padding:0 6px;font:600 11px var(--font)}
  .nb-bar .nb-grip{background:var(--brand);border-color:var(--brand);color:#fff}
  .nb-bar .nb-del{cursor:pointer} .nb-bar .nb-del:hover{color:var(--bad);border-color:var(--bad)}
  .nb-it:hover .nb-bar,.nb-it.sel .nb-bar{display:flex} .drawmode .nb-bar,.drawmode .nb-rs{display:none!important}
  .nb-txt{outline:none;min-height:26px;padding:4px 8px;border-radius:8px;border:1px dashed transparent;font-size:15px;line-height:1.6;color:var(--text)}
  .nb-txt:focus,.nb-it.sel .nb-txt{border-color:var(--line2);background:color-mix(in srgb,var(--panel) 70%,transparent)}
  .nb-txt img{max-width:100%;border-radius:10px;display:block} .nb-txt figure{margin:6px 0} .nb-txt figcaption{font-size:12px;color:var(--muted)}
  #nbPdf{flex:none;display:inline-flex;padding:5px 10px} #nbPdf .ico{margin:0}
  .nb-txt h3{margin:4px 0;font-size:17px} .nb-txt ul{margin:2px 0;padding-left:20px} .nb-txt p{margin:2px 0}
  .nb-img{cursor:move} .nb-img:active{cursor:grabbing} .nb-img img{width:100%;border-radius:10px;display:block;border:1px solid var(--line2);user-select:none;-webkit-user-drag:none}
  .nb-it.sel img{outline:2px solid var(--brand);outline-offset:2px}
  .nb-rs{position:absolute;right:-7px;bottom:14px;width:14px;height:14px;border-radius:4px;background:var(--brand);cursor:nwse-resize;display:none;border:2px solid #fff}
  .nb-it:hover .nb-rs,.nb-it.sel .nb-rs{display:block}
  .nb-cap{font-size:12px;color:var(--muted);margin-top:5px}
  .nb-ts{cursor:grab} .nb-lbl{font-size:13px;color:var(--text2)}
  .tsn{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:7px;background:var(--brandSoft);color:#c4b6ff;font:600 12px var(--mono);cursor:pointer;text-decoration:none;user-select:none}
  :root[data-theme=light] .tsn{color:#5b3fe0}
  .nb-page.printing{background:#fff!important;border-color:#fff} .printing .nb-bar,.printing .nb-rs{display:none!important}
  .printing .nb-txt{color:#111!important;border-color:transparent!important;background:transparent!important} .printing .tsn{color:#4b2fd0;background:#efeaff}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90;animation:fsh .35s}
  @keyframes fsh{20%{opacity:.35}100%{opacity:0}}
  .nbpane{position:relative}
  .nb-ask{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--line);background:var(--panel);flex:none}
  .nb-ask .in{padding:9px 12px}
  #nbExplain{flex:none} #nbExplain:disabled{opacity:.45}
  #nbExplain.ready{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
  .nb-card{position:absolute;right:14px;bottom:70px;width:min(460px,calc(100% - 28px));max-height:58%;overflow:auto;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fd .25s ease}
  .nb-card h3{margin:0 0 4px;font-size:15.5px} .nb-card .sum{color:var(--text2);margin:0 0 8px;font-size:14px}
  .nb-card h4{margin:8px 0 2px;font-size:13.5px;color:var(--brand2)} .nb-card ul{margin:0;padding-left:18px;font-size:14px} .nb-card li{margin:4px 0}
  .nb-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px} .nb-card .hd .sp{flex:1}
  .nb-card .q{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .nb-card .acts{display:flex;gap:6px;margin-top:10px}
  /* collapsible sidebar: slim rail, opens on hover, menu button pins it open */
  @media (min-width:781px){
    body:not(.pinned) .app{grid-template-columns:68px 1fr}
    .side{position:relative;z-index:40;transition:width .18s ease,box-shadow .18s}
    body:not(.pinned) .side{width:68px;overflow:hidden}
    .app{position:relative} .main{grid-column:2;grid-row:1} .side{grid-column:1;grid-row:1}
    body:not(.pinned) .side:hover{position:absolute;left:0;top:0;bottom:0;width:292px;box-shadow:24px 0 60px rgba(0,0,0,.45)}
    body:not(.pinned) .side:not(:hover) .blk,
    body:not(.pinned) .side:not(:hover) .navl span,
    body:not(.pinned) .side:not(:hover) .vc > div,
    body:not(.pinned) .side:not(:hover) .me > div:not(.av),
    body:not(.pinned) .side:not(:hover) .me button{display:none}
    body:not(.pinned) .side:not(:hover) .navl button{justify-content:center;padding:10px 0}
    body:not(.pinned) .side:not(:hover) .vc{padding:6px;justify-content:center}
    body:not(.pinned) .side:not(:hover) .vc img{width:44px;height:30px}
    body:not(.pinned) .side:not(:hover) .lib{padding:4px 6px}
    body:not(.pinned) .side:not(:hover) .me{justify-content:center;padding:10px 0}
    .side > *{min-width:0}
  }
  body.pinned #pinBtn{background:var(--brandSoft);border-color:var(--brand)}
  /* home — dynamic */
  .home{position:relative;overflow:hidden;padding-bottom:60px}
  .aurora{position:absolute;inset:-20% -10% auto -10%;height:720px;pointer-events:none;filter:blur(70px);opacity:.55;z-index:0}
  .aurora span{position:absolute;border-radius:50%;animation:fl 16s ease-in-out infinite alternate}
  .aurora span:nth-child(1){width:520px;height:520px;left:8%;top:0;background:#7c5cff}
  .aurora span:nth-child(2){width:460px;height:460px;right:6%;top:60px;background:#22d3ee;animation-duration:19s}
  .aurora span:nth-child(3){width:380px;height:380px;left:40%;top:220px;background:#f472b6;opacity:.6;animation-duration:23s}
  @keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,20px) scale(.95)}}
  :root[data-theme=light] .aurora{opacity:.28}
  .home .hero{position:relative;z-index:1;padding-bottom:10px}
  .hero h1{background:linear-gradient(90deg,var(--text),#b8a8ff,var(--brand2),var(--text));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 9s linear infinite}
  @keyframes gs{to{background-position:300% 0}}
  .bigin .bi{display:grid;place-items:center;padding-left:10px;color:var(--muted)}
  .try{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .try button{border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--text2);border-radius:99px;padding:5px 12px;font:13px var(--font);cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
  .try button:hover{border-color:var(--brand);color:var(--text);transform:translateY(-1px)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:720px;margin:30px auto 0}
  .stats div{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--panel) 75%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px)}
  .stats b{display:block;font-size:28px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(135deg,var(--text),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats span{font-size:12px;color:var(--muted);font-weight:600}
  .demo{position:relative;z-index:1;max-width:1040px;margin:34px auto 0;padding:0 24px}
  .dlabel{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}
  .live{width:8px;height:8px;border-radius:50%;background:#f43f5e;box-shadow:0 0 0 0 rgba(244,63,94,.6);animation:lv 1.6s infinite}
  @keyframes lv{70%{box-shadow:0 0 0 8px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}
  .dgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:14px;border-radius:20px;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
  .dvid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#1e1b4b,#0e7490);background-size:cover;background-position:center}
  .dvid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75))}
  .dplay{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:#fff}
  .dplay .ico{width:54px;height:54px;padding:14px;border-radius:50%;background:rgba(124,92,255,.85);box-shadow:0 0 30px rgba(124,92,255,.7)}
  .dcap{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px #000}
  .dtl{position:relative;height:30px;margin-top:10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .dtl i{position:absolute;top:0;bottom:0;background:#7c5cff;opacity:.08;transition:opacity .6s,background .6s}
  .dtl .nd{position:absolute;top:0;bottom:0;width:2px;background:var(--brand2);box-shadow:0 0 8px var(--brand2);transition:left 1.2s ease}
  .dchat{display:flex;flex-direction:column;gap:10px;min-height:280px}
  .dchat .bub{align-self:flex-end;min-height:22px}
  .dchat .bub::after{content:"";display:inline-block;width:2px;height:14px;background:#fff;margin-left:2px;vertical-align:-2px;animation:bk 1s steps(1) infinite}
  @keyframes bk{50%{opacity:0}}
  .dsteps{display:flex;gap:4px}
  .dsteps span{flex:1;text-align:center;padding:5px 0;border-radius:8px;font:600 10.5px var(--mono);color:var(--muted);background:var(--panel2);border:1px solid var(--line);transition:.3s}
  .dsteps span.on{color:#fff;background:linear-gradient(135deg,var(--brand),#5b8cff);border-color:transparent}
  .dans{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;flex:1}
  .dans .ln{opacity:0;transform:translateY(6px);transition:.4s;margin:5px 0}
  .dans .ln.on{opacity:1;transform:none}
  .hero2{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 24px}
  .rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
  .rail .yt{min-width:240px;max-width:240px;scroll-snap-align:start}
  @media (max-width:900px){.dgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:1100px){.work{grid-template-columns:1fr;height:auto}.right{min-height:640px}}
  @media (max-width:780px){.app{grid-template-columns:1fr;height:auto}.steps,.feat{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>{x=Math.max(0,Math.floor(x||0));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let player=null,ytReady=false,cur=null,lib=[],trChunks=[],heat=null,lastSegs=[],lastQuiz=[],quizScore={ok:0,n:0},level="simple",amode="library",chatHist=[],me={auth:false,user:null},signupMode=false,lastQ="";
window.onYouTubeIframeAPIReady=()=>{ytReady=true};
function toast(m){const d=document.createElement("div");d.className="toast fade";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
applyLang();applyIcons();

/* sidebar pin (menu button) */
const setPin=v=>{document.body.classList.toggle("pinned",v);store.set("pinSide",v?"1":"0");setTimeout(()=>{if(window.nbRelayout)window.nbRelayout()},200)};
setPin(store.get("pinSide")==="1");
$("pinBtn").onclick=()=>setPin(!document.body.classList.contains("pinned"));

const setTheme=x=>{document.documentElement.dataset.theme=x;store.set("theme",x)};
setTheme(store.get("theme")||"dark");
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

$("appkey").value=store.get("appkey")||"";
$("appkey").onchange=()=>{store.set("appkey",$("appkey").value);loadLib()};
const hdr=()=>({"Content-Type":"application/json","x-app-key":$("appkey").value,"x-lang":LANG});
async function api(path,body,opt){
  const r=await fetch(path,opt?{method:opt.method,headers:hdr(),credentials:"same-origin",body:JSON.stringify(opt.body)}:body===undefined?{headers:hdr(),credentials:"same-origin"}:{method:"POST",headers:hdr(),credentials:"same-origin",body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({detail:"bad server response"}));
  if(r.status===401){if(d.login)showAuth();else{$("keyBlk").classList.remove("hide");$("appkey").focus()} throw new Error(d.login?t("login"):t("needKey"))}
  if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));
  if(me.user&&/\/api\/(ask|quiz|explain|alternatives|plan)/.test(path))refreshMe();
  return d;
}
let healthOk=null;const drawHealth=()=>{if(healthOk!==null)$("health").innerHTML='<span class="dot '+(healthOk?"ok":"bad")+'"></span>'+t(healthOk?"online":"offline")};
fetch("/healthz").then(r=>r.json()).then(()=>{healthOk=true;drawHealth()}).catch(()=>{healthOk=false;drawHealth()});

/* auth */
function showAuth(){$("authBox").classList.remove("hide");setTimeout(()=>$("aEmail").focus(),50)}
function setAuthMode(s){signupMode=s;$("nameRow").classList.toggle("hide",!s);$("aBtn").dataset.t=s?"signup":"login";$("swTxt").dataset.t=s?"haveAcct":"noAcct";$("swLink").dataset.t=s?"login":"create";$("aPass").autocomplete=s?"new-password":"current-password";applyLang()}
$("swLink").onclick=()=>setAuthMode(!signupMode);
async function doAuth(){
  $("aErr").textContent="";
  try{const r=await fetch("/api/auth/"+(signupMode?"signup":"login"),{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:$("aEmail").value,password:$("aPass").value,name:$("aName").value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.detail||r.status);
    $("authBox").classList.add("hide"); $("aPass").value=""; await refreshMe(); loadLib();
  }catch(e){$("aErr").textContent=e.message}
}
$("aBtn").onclick=doAuth; $("aPass").onkeydown=e=>{if(e.key==="Enter")doAuth()};
async function refreshMe(){
  try{me=await (await fetch("/api/auth/me",{headers:hdr(),credentials:"same-origin"})).json()}catch(e){return}
  if(me.app_password&&!$("appkey").value)$("keyBlk").classList.remove("hide");
  if(me.auth&&!me.user){showAuth();return}
  if(me.user){$("meBox").classList.remove("hide");$("histNav").classList.remove("hide");$("meAv").textContent=(me.user.name||me.user.email)[0].toUpperCase();$("meName").textContent=me.user.name||me.user.email;
    $("meUse").textContent=t("usage")+": "+me.used+" / "+me.limit;$("meBar").style.width=Math.min(100,100*me.used/Math.max(1,me.limit))+"%"}
}

/* index / upload */
async function poll(id){
  try{const d=await api("/api/job/"+id);
    if(d.status==="done"){$("status").innerHTML='<span class="badge ok">'+ic("check",12)+' '+t("ready")+"</span>";await loadLib();show(d.meta)}
    else if(d.status==="error"){$("status").innerHTML='<span class="badge bad">'+t("error")+"</span> "+esc(tMsg(d.msg));document.querySelectorAll(".yt .go .spin").forEach(s=>s.parentNode.textContent=t("indexIt"))}
    else{$("status").innerHTML=esc(tMsg(d.msg)||"…")+'<div class="prog"><i></i></div>';setTimeout(()=>poll(id),1500)}
  }catch(e){$("status").textContent=e.message}
}
async function indexUrl(u){
  if(!u.trim())return; $("status").innerHTML=t("starting")+'<div class="prog"><i></i></div>';
  try{const d=await api("/api/index",{url:u});poll(d.video_id)}catch(e){$("status").innerHTML='<span class="badge bad">'+esc(tMsg(e.message))+"</span>"}
}
$("idxBtn").onclick=()=>indexUrl($("url").value);
$("url").onkeydown=e=>{if(e.key==="Enter")indexUrl($("url").value)};
const isLink=s=>/youtu\.?be|^[\w-]{11}$/.test(s.trim());

const now=()=>{if(!cur)return 0;if(cur.kind==="upload"){const v=$("vid");return v?v.currentTime:0}return player&&player.getCurrentTime?player.getCurrentTime():0};
function seek(s,vid){
  if(vid&&cur&&vid!==cur.video_id){window.open("https://www.youtube.com/watch?v="+vid+"&t="+Math.floor(s)+"s","_blank");return}
  if(!cur)return;if(cur.kind==="upload"){const v=$("vid");if(v){v.currentTime=s;v.play()}}else if(player&&player.seekTo){player.seekTo(s,true);player.playVideo()}
}

/* transcript */
async function loadTranscript(){
  $("tr").innerHTML='<div class="shimmer"></div><div class="shimmer" style="width:80%"></div>';
  try{trChunks=(await api("/api/transcript/"+cur.video_id)).chunks;drawTr()}catch(e){$("tr").innerHTML='<div class="muted">'+esc(e.message)+"</div>"}
}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function drawTr(){
  const q=$("trq").value.trim(),rx=q?new RegExp(reEsc(q),"i"):null,L=rx?trChunks.filter(c=>rx.test(c.text)):trChunks;
  $("tr").innerHTML=L.map(c=>'<div class="tc" id="tc'+c.i+'" data-s="'+c.start+'"><span class="ts">'+fmt(c.start)+"</span><span>"+(q?esc(c.text).replace(new RegExp(reEsc(esc(q)),"gi"),m=>"<mark>"+m+"</mark>"):esc(c.text))+"</span></div>").join("")||'<div class="muted">'+t("nothing")+"</div>";
  document.querySelectorAll(".tc").forEach(el=>el.onclick=()=>seek(+el.dataset.s));
}
$("trq").oninput=drawTr;

/* topic timeline */
function drawTL(){
  const D=(cur&&cur.duration)||1;let h="";
  if(heat&&heat.cells.length)heat.cells.forEach(c=>{const a=Math.pow(c.score,1.6);h+='<div class="cell" title="'+fmt(c.start)+"–"+fmt(c.end)+" · "+Math.round(c.score*100)+'%" style="left:'+(100*c.start/D)+"%;width:"+(100*(c.end-c.start)/D)+"%;background:rgba(124,92,255,"+(0.08+0.85*a)+')"></div>'});
  else h+='<div class="lbl">'+t("tlHint")+"</div>";
  lastSegs.forEach(s=>{h+='<div class="segm" style="left:'+(100*s.start/D)+"%;width:"+Math.max(0.6,100*(s.end-s.start)/D)+'%"></div>'});
  $("tl").innerHTML=h+'<div class="needle" id="needle" style="left:0"></div>';
  if(heat&&lastQ)$("tlHint").textContent="“"+lastQ.slice(0,40)+"” — "+t("tlOn");
}
$("tl").onclick=e=>{const r=$("tl").getBoundingClientRect();seek(((e.clientX-r.left)/r.width)*((cur&&cur.duration)||0))};
setInterval(()=>{if(!cur||$("v_work").classList.contains("hide"))return;const s=now(),D=cur.duration||1,n=$("needle");if(n)n.style.left=Math.min(100,100*s/D)+"%";
  const c=trChunks.find(c=>s>=c.start&&s<c.end);document.querySelectorAll(".tc.now").forEach(x=>x.classList.remove("now"));
  if(c){const el=$("tc"+c.i);if(el){el.classList.add("now");if($("follow").checked&&!$("trq").value&&document.activeElement!==$("trq")){const box=$("tr");if(el.offsetTop<box.scrollTop||el.offsetTop>box.scrollTop+box.clientHeight-40)box.scrollTop=el.offsetTop-box.offsetTop-40}}}
},500);

/* ask */
const refChip=(rf,vid)=>'<span class="chip" onclick="seek('+rf.start+(vid?",'"+esc(vid)+"'":"")+')">'+ic("play",10)+' '+(rf.n?rf.n+" · ":"")+fmt(rf.start)+"</span>";
const chips=(cites,refs,vid)=>(cites||[]).map(n=>{const rf=(refs||[]).find(x=>x.n===n);return rf?refChip(rf,vid):""}).join("");
function answerHtml(a,refs,vid){let h="<h3>"+esc(a.title)+'</h3><p class="sum">'+esc(a.summary)+"</p>";
  (a.sections||[]).forEach(s=>{h+=(s.heading?"<h4>"+esc(s.heading)+"</h4>":"")+"<ul>";(s.points||[]).forEach(p=>{h+="<li>"+esc(p.text)+" "+chips(p.cites,refs,vid)+"</li>"});h+="</ul>"});return h}
function pipeHtml(tr,run){const tm=(tr&&tr.timings_ms)||{},u=(tr&&tr.usage)||{},st=[["rewrite",t("pRewrite")],["retrieve",t("pRetrieve")],["grade",t("pGrade")],["generate",t("pGenerate")],["verify",t("pVerify")]];
  return '<div class="pipe'+(run?" run":"")+'">'+st.map(([k,l])=>"<div><b>"+l+"</b><span>"+(run?"…":(tm[k]!=null?(tm[k]/1000).toFixed(1)+"s":"—"))+"</span></div>").join("")+"</div>"+(run?"":'<div class="muted" style="margin-top:6px">'+(u.llm_calls||0)+" "+t("llmCalls")+" · "+(u.embed_calls||0)+" "+t("embCalls")+(u.llm_fallbacks?" · "+u.llm_fallbacks+" "+t("fallback"):"")+"</div>")}
function toMd(q,d){let m="# "+(d.answer?d.answer.title:q)+"\n\n> "+q+"\n\n"+(d.answer?d.answer.summary+"\n\n":"");
  if(d.answer)d.answer.sections.forEach(s=>{m+="## "+s.heading+"\n";s.points.forEach(p=>{m+="- "+p.text+" "+(p.cites||[]).map(n=>{const r=d.refs.find(x=>x.n===n);return r?"["+fmt(r.start)+"]("+r.url+")":""}).join(" ")+"\n"});m+="\n"});
  return m+"\nSource: "+(cur.title||"")+"\n"}
async function ask(){
  const q=$("q").value.trim();if(!cur||!q)return;$("q").value="";$("q").style.height="auto";lastQ=q;
  if(!chatHist.length)$("chat").innerHTML="";
  const box=document.createElement("div");
  box.innerHTML='<div class="msg mine fade"><div class="bub">'+esc(q)+'</div></div><div class="msg fade"><div class="ans"><div class="row" style="gap:10px"><span class="spin"></span><b>'+t("thinking")+'</b><span class="muted">'+t("pipeline")+"</span></div>"+pipeHtml(null,true)+'<div class="shimmer" style="margin-top:14px"></div><div class="shimmer" style="width:70%"></div></div></div>';
  $("chat").appendChild(box);$("p_ask").scrollTop=1e9;$("askBtn").disabled=true;
  api("/api/heat",{video_id:cur.video_id,question:q}).then(h=>{heat=h;drawTL()}).catch(()=>{});
  try{
    const d=await api("/api/ask",{video_id:cur.video_id,question:q,current_time:$("spoiler").checked?now():null,clip:$("clip").checked,level});
    chatHist.push({q,d});const tr=d.trace||{};let h;
    if(!d.found){lastSegs=[];h='<div class="ans" style="border-color:var(--bad)"><div class="meta"><span class="badge bad">'+ic("x",12)+' '+t("notFound")+"</span></div><b>"+esc($("spoiler").checked?t("notFoundUpTo",{t:fmt(now())}):t("notFoundMsg"))+'</b><p class="muted" style="margin:6px 0 0">'+t("notFoundD")+"</p>"+pipeHtml(tr)+"</div>"}
    else{
      lastSegs=d.segments||[];const tot=tr.claims_total||0,sup=tr.claims_supported||0;
      const vb=tr.verify==="ok"?'<span class="badge ok">'+ic("check",12)+' '+sup+"/"+tot+" "+t("verified")+"</span>":'<span class="badge warn">'+ic("alert",12)+' '+t("unverified")+"</span>";
      h='<div class="ans"><div class="meta">'+vb+'<span class="badge">'+(d.refs||[]).length+" "+t("evidence")+'</span><span class="badge">'+esc(t(level))+"</span></div>"+(d.answer?answerHtml(d.answer,d.refs):"<p><b>"+esc(d.note)+"</b></p>");
      h+='<div class="segs">'+lastSegs.map(s=>'<div class="sgi"><button class="play" onclick="seek('+s.start+')">'+ic("play",13)+'</button><div style="flex:1;min-width:0"><b style="font-family:var(--mono);font-size:13px">'+fmt(s.start)+" – "+fmt(s.end)+'</b> <span class="muted">· '+Math.round(s.end-s.start)+"s "+t("segment")+"</span>"+(s.clip?"<details><summary>"+t("clipFile")+"</summary>"+(s.clip.endsWith(".m4a")?'<audio controls preload="none" src="'+esc(s.clip)+'"></audio>':'<video controls preload="metadata" src="'+esc(s.clip)+'"></video>')+"</details>":"")+'</div><a class="btn sm ghost" target="_blank" href="'+esc(s.url)+'">YouTube '+ic("external",12)+'</a></div>').join("")+"</div>";
      h+=pipeHtml(tr)+'<div class="acts"><button class="btn sm" data-a="copy">'+ic("copy",13)+' '+t("copy")+'</button><button class="btn sm" data-a="md">'+ic("download",13)+' '+t("notes")+'</button><button class="btn sm" data-a="note">'+ic("book",13)+' '+t("addToNotes")+'</button><button class="btn sm" data-a="trace">'+ic("code",13)+' '+t("trace")+'</button></div><pre class="code hide">'+esc(JSON.stringify(tr,null,2))+"</pre></div>";
    }
    box.lastChild.innerHTML=h;drawTL();
    const idx=chatHist.length-1;
    box.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const {q,d}=chatHist[idx];
      if(b.dataset.a==="copy"){navigator.clipboard.writeText(toMd(q,d));toast(t("copied"))}
      if(b.dataset.a==="md"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([toMd(q,d)],{type:"text/markdown"}));a.download="notes.md";a.click()}
      if(b.dataset.a==="trace")box.querySelector("pre").classList.toggle("hide");if(b.dataset.a==="note")window.answerToNotes(q,d)});
  }catch(e){box.lastChild.innerHTML='<div class="ans" style="border-color:var(--bad)"><span class="badge bad">'+t("error")+"</span> "+esc(tMsg(e.message))+"</div>"}
  $("askBtn").disabled=false;$("p_ask").scrollTop=1e9;
}

/* compare */
const busy=el=>{$(el).innerHTML='<div class="card"><div class="row"><span class="spin"></span><span class="muted">'+t("working")+'</span></div><div class="shimmer"></div><div class="shimmer" style="width:60%"></div></div>'};
const errBox=(el,e)=>{$(el).innerHTML='<div class="card" style="border-color:var(--bad)"><span class="badge bad">'+t("error")+"</span> "+esc(tMsg(e.message))+"</div>"};
const L=i=>String.fromCharCode(65+i);
$("altBtn").onclick=async()=>{
  if(!$("aq").value.trim())return;busy("altOut");
  try{const d=await api("/api/alternatives",{question:$("aq").value,video_id:cur?cur.video_id:null,mode:amode});
    if(!d.videos.length){$("altOut").innerHTML='<div class="card"><span class="badge warn">'+t("nothing")+"</span> "+esc(d.message||"")+"</div>";return}
    let h=d.videos.map((v,i)=>'<div class="ans fade" style="margin-bottom:12px"><div class="meta"><span class="badge">'+t("videoL")+' '+L(i)+'</span><span class="muted">'+esc(v.title)+"</span></div>"+answerHtml(v.answer,v.refs,v.video_id)+"</div>").join("");
    const c=d.comparison;
    if(c){const tbl=rows=>'<table class="t">'+rows.map(x=>"<tr><th>"+esc(x.topic)+"</th><td>"+(x.views||[]).map(v=>"<b>"+L(v.video)+":</b> "+esc(v.says)).join("<br>")+"</td></tr>").join("")+"</table>";
      h+='<div class="card fade"><div class="h">'+t("compare")+"</div>";
      if(c.common.length)h+="<b>"+ic("check",13)+" "+t("common")+"</b><ul>"+c.common.map(x=>"<li>"+esc(x.text)+"</li>").join("")+"</ul>";
      if(c.different.length)h+="<b>"+ic("scale",13)+" "+t("diff")+"</b>"+tbl(c.different);
      if(c.conflicts.length)h+='<b style="color:var(--bad)">'+ic("alert",12)+' '+t("conflict")+'</b> <span class="muted">'+t("noVerdict")+"</span>"+tbl(c.conflicts);
      if(c.unique.length)h+="<b>"+ic("star",13)+" "+t("unique")+"</b><ul>"+c.unique.map(x=>"<li><b>"+L(x.video)+":</b> "+esc(x.text)+"</li>").join("")+"</ul>";
      h+="</div>"}
    if(d.skipped&&d.skipped.length)h+='<div class="muted" style="margin-top:8px">'+t("skipped")+": "+d.skipped.map(s=>esc(s.title||s.id)+" ("+esc(s.reason)+")").join("; ")+"</div>";
    $("altOut").innerHTML=h}catch(e){errBox("altOut",e)}
};

/* plan */
let planQs=[];
$("planBtn").onclick=async()=>{
  if(!$("goal").value.trim())return;$("pretest").innerHTML='<div class="shimmer"></div>';
  try{const d=await api("/api/plan/start",{goal:$("goal").value});planQs=d.questions;
    $("pretest").innerHTML=planQs.map((q,i)=>'<div style="margin-top:10px"><b style="font-size:14px">'+(i+1)+". "+esc(q)+'</b><textarea class="in" id="pa'+i+'" rows="2" placeholder="'+esc(t("answerPh"))+'"></textarea></div>').join("")+'<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn pri" id="planGo">'+t("makePlan")+"</button></div>";
    $("planGo").onclick=planFinish}catch(e){$("pretest").innerHTML='<span class="badge bad">'+esc(e.message)+"</span>"}
};
async function planFinish(){
  busy("planOut");
  try{const d=await api("/api/plan/finish",{goal:$("goal").value,qa:planQs.map((q,i)=>({q,a:$("pa"+i).value})),video_ids:lib.map(v=>v.video_id)});
    let h='<div class="card fade"><div class="row"><span class="badge ok">'+t("known")+": "+esc((d.known||[]).join(", ")||"—")+'</span><span class="badge warn">'+t("gaps")+": "+esc((d.gaps||[]).join(", "))+"</span></div></div>";
    if(d.total_sec)h+='<div class="card fade" style="margin-top:10px"><b style="font-size:22px">'+Math.round(d.watch_sec/60)+" "+t("minutes")+'</b> <span class="muted">'+t("planSave")+" "+Math.round(d.total_sec/60)+" "+t("minutes")+"</span></div>";
    h+=(d.plan||[]).map((p,i)=>'<div class="sgi fade" style="margin-top:8px"><span class="play" style="background:var(--panel);color:var(--text);border:1px solid var(--line2)">'+(i+1)+'</span><div style="flex:1"><b>'+esc(p.gap)+'</b><div class="muted">'+esc(p.title)+" · "+fmt(p.start)+"–"+fmt(p.end)+'</div><div style="font-size:13.5px">'+esc(p.why)+'</div></div><a class="btn sm" target="_blank" href="'+esc(p.url)+'">'+t("watch")+" "+ic("external",12)+"</a></div>").join("");
    $("planOut").innerHTML=h}catch(e){errBox("planOut",e)}
}

/* quiz */
$("quizBtn").onclick=async()=>{
  if(!cur)return;busy("quizOut");quizScore={ok:0,n:0};
  try{const d=await api("/api/quiz",{video_id:cur.video_id,n:5,topic:$("qtopic").value||null,current_time:$("qspoiler").checked?now():null});
    lastQuiz=d.questions||[];
    $("quizOut").innerHTML=lastQuiz.length?'<div class="card soft" id="score" style="margin-bottom:10px"><b>'+t("score")+": 0 / "+lastQuiz.length+"</b></div>"+lastQuiz.map((q,i)=>'<div class="card fade" style="margin-bottom:10px"><b>'+(i+1)+". "+esc(q.q)+"</b>"+q.options.map((o,j)=>'<button class="opt" id="o'+i+"_"+j+'" onclick="pickOpt('+i+","+j+')">'+"ABCD"[j]+") "+esc(o)+"</button>").join("")+'<div id="fb'+i+'"></div></div>').join(""):'<div class="card"><span class="badge warn">'+t("quizFail")+"</span></div>"}catch(e){errBox("quizOut",e)}
};
function pickOpt(i,j){
  const q=lastQuiz[i];if(q.done)return;q.done=true;quizScore.n++;if(j===q.answer)quizScore.ok++;
  $("o"+i+"_"+j).classList.add(j===q.answer?"right":"wrong");$("o"+i+"_"+q.answer).classList.add("right");
  $("fb"+i).innerHTML='<div style="margin-top:8px">'+(j===q.answer?'<span class="badge ok">'+ic("check",12)+' '+t("right")+"</span> ":'<span class="badge bad">'+ic("x",12)+' '+t("wrong")+"</span> ")+esc(q.explanation)+' <span class="chip" onclick="seek('+q.start+')">'+ic("play",10)+' '+fmt(q.start)+"</span></div>";
  $("score").innerHTML="<b>"+t("score")+": "+quizScore.ok+" / "+lastQuiz.length+"</b>"+(quizScore.n===lastQuiz.length?' <span class="muted">'+t("quizDone")+"</span>":"");
}
$("ankiBtn").onclick=()=>{
  if(!lastQuiz.length){toast(t("quizFirst"));return}
  const rows=lastQuiz.map(q=>[q.q+"<br>"+q.options.map((o,i)=>(i+1)+") "+o).join("<br>"),q.options[q.answer]+"<br>"+q.explanation+" ("+fmt(q.start)+")"].map(x=>'"'+x.replace(/"/g,'""')+'"').join("\t"));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/tab-separated-values"}));a.download="anki.tsv";a.click();
};

/* explain */
document.querySelectorAll("#p_exp [data-s]").forEach(b=>b.onclick=async()=>{
  if(!cur)return;busy("expOut");
  try{const d=await api("/api/explain",{video_id:cur.video_id,current_time:now(),style:b.dataset.s});
    let h='<div class="ans fade"><div class="meta"><span class="chip" onclick="seek('+d.passage.start+')">'+ic("play",10)+' '+fmt(d.passage.start)+"–"+fmt(d.passage.end)+'</span><span class="badge">'+esc(d.style)+'</span></div><p style="white-space:pre-wrap;margin:0">'+esc(d.explanation)+"</p>";
    if(d.source)h+='<div class="sgi" style="margin-top:10px">'+ic("film",18)+'<div style="flex:1"><b>'+t("otherVideo")+":</b> "+esc(d.source.title)+'</div><a class="btn sm" target="_blank" href="'+esc(d.source.url)+'">'+fmt(d.source.start)+" "+ic("external",12)+"</a></div>";
    $("expOut").innerHTML=h+"</div>"}catch(e){errBox("expOut",e)}
});

window.openNotes=()=>document.querySelector('#tabs button[data-tab="notes"]').click();
$("qNotes").onclick=window.openNotes;
$("qTs").onclick=()=>{window.openNotes();setTimeout(()=>window.nbTimestamp(),30)};
$("qSnap").onclick=()=>window.nbSnap();
document.addEventListener("keydown",e=>{if(!e.altKey||!cur||$("v_work").classList.contains("hide"))return;const k=e.key.toLowerCase();
  if(k==="s"){e.preventDefault();window.nbSnap()} if(k==="n"){e.preventDefault();window.openNotes();setTimeout(()=>window.nbTimestamp(),30)}});

/* ---------- home: live stats, typing placeholder, animated product preview, continue rail ---------- */
function countUp(el,to){const from=+el.dataset.n||0;el.dataset.n=to;const t0=performance.now(),d=900;const f=n=>{const k=Math.min(1,(n-t0)/d),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString(LANG==="bn"?"bn-BD":"en");if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function homeStats(){countUp($("stV"),lib.length);countUp($("stM"),Math.round(lib.reduce((a,v)=>a+(v.duration||0),0)/60));countUp($("stC"),lib.reduce((a,v)=>a+(v.n_chunks||0),0));
  const yt=lib.filter(v=>v.kind==="youtube");$("contBox").classList.toggle("hide",!yt.length);
  $("rail").innerHTML=yt.map(v=>'<div class="yt" data-id="'+esc(v.video_id)+'"><div class="th"><img loading="lazy" src="'+thumb(v.video_id)+'" alt=""><span class="dur">'+fmt(v.duration)+'</span></div><div class="bd"><div class="tt">'+esc(v.title)+'</div><div class="ch">'+v.n_chunks+" "+t("chunks")+"</div></div></div>").join("");
  document.querySelectorAll("#rail .yt").forEach(el=>el.onclick=()=>openVid(el.dataset.id));
  if(yt.length&&!demoStarted)startDemo()}
$("tryChips").innerHTML="";
function tryChips(){$("tryChips").innerHTML=t("tryList").map(x=>'<button>'+esc(x)+"</button>").join("");document.querySelectorAll("#tryChips button").forEach(b=>b.onclick=()=>{$("heroQ").value=b.textContent;$("heroBtn").click()})}
tryChips();
let phI=0,phJ=0,phDel=false;
setInterval(()=>{const L=t("heroPhList"),w=L[phI%L.length];if(document.activeElement===$("heroQ")||$("heroQ").value){return}
  phJ+=phDel?-1:1;$("heroQ").placeholder=w.slice(0,phJ)+(phDel?"":"▍");if(!phDel&&phJ>=w.length+12)phDel=true;if(phDel&&phJ<=0){phDel=false;phI++}},70);
let demoStarted=false,demoGen=0;
function startDemo(){
  demoStarted=true;const gen=++demoGen;const S=t("demoSteps");$("dSteps").innerHTML=S.map(x=>"<span>"+x+"</span>").join("");
  let k=0;
  const w=async ms=>{await sleep(ms);if(gen!==demoGen)throw "stale"};
  const run=async()=>{try{
    if(gen!==demoGen)return;
    const yt=lib.filter(v=>v.kind==="youtube");if(!yt.length)return;const ex=t("demoQs")[k%t("demoQs").length];const v=yt.find(x=>new RegExp(ex.key,"i").test(x.title))||yt[k%yt.length];k++;
    $("dVid").style.backgroundImage="url(https://i.ytimg.com/vi/"+encodeURIComponent(v.video_id)+"/hqdefault.jpg)";$("dCap").textContent=v.title;$("dEnd").textContent=fmt(v.duration);
    const n=24;$("dTl").innerHTML=Array.from({length:n},(_,i)=>'<i style="left:'+(100*i/n)+"%;width:"+(100/n+.2)+'%"></i>').join("")+'<div class="nd" style="left:0"></div>';
    $("dAns").innerHTML="";document.querySelectorAll("#dSteps span").forEach(x=>x.classList.remove("on"));
    const q=ex.q;for(let i=0;i<=q.length;i++){if(gen!==demoGen)return;$("dQ").textContent=q.slice(0,i);await w(38)}
    const hot=Math.floor(Math.random()*(n-6))+3;
    document.querySelectorAll("#dTl i").forEach((c,i)=>{const d=Math.abs(i-hot),a=d===0?1:d===1?.7:d===2?.35:Math.random()*.12;setTimeout(()=>{c.style.opacity=.08+.9*a},90*i)});
    for(const x of document.querySelectorAll("#dSteps span")){await w(420);x.classList.add("on")}
    document.querySelector("#dTl .nd").style.left=(100*hot/n)+"%";
    const mm=fmt(v.duration*hot/n);
    $("dAns").innerHTML='<div class="ln"><span class="badge ok">'+ic("check",12)+" "+ex.v+'</span></div><div class="ln"><b>'+esc(ex.a1)+'</b></div><div class="ln">• '+esc(ex.a2)+' <span class="chip">'+ic("play",10)+" "+mm+'</span></div><div class="ln">• '+esc(ex.a3)+' <span class="chip">'+ic("play",10)+" "+fmt(v.duration*(hot+1)/n)+"</span></div>";
    for(const x of document.querySelectorAll("#dAns .ln")){await w(350);x.classList.add("on")}
    await w(4200);if(!$("v_home").classList.contains("hide"))run();else demoStarted=false;
  }catch(e){}};run();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

window.onLang=()=>{drawHealth();if(demoStarted){demoStarted=false;if(!$("v_home").classList.contains("hide")&&lib.length)startDemo()}drawLib();tryChips();homeStats();if(cur&&!$("v_work").classList.contains("hide")){suggest();drawTL();$("vmeta").innerHTML=metaBadges(cur)}refreshMe()};
setAuthMode(false);
refreshMe().then(()=>{if(!(me.auth&&!me.user))loadLib()});
