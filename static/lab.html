<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Lab — Vidya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<style>
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
  .ctl{display:grid;grid-template-columns:minmax(220px,1.1fr) 2fr auto;gap:10px;align-items:center}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .arch{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0 2px}
  .node{flex:none;padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:650;text-align:center;min-width:92px;transition:.2s}
  .node small{display:block;font:500 10.5px var(--mono);color:var(--muted);margin-top:2px}
  .node.lit{border-color:var(--brand);background:var(--brandSoft);box-shadow:0 0 18px rgba(124,92,255,.35)}
  .arr{color:var(--muted);flex:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px} .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:650}
  .flow{position:relative;padding-left:34px}
  .flow::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--brand),var(--brand2))}
  .st{position:relative;margin-bottom:14px}
  .st .num{position:absolute;left:-34px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--panel);border:2px solid var(--brand);display:grid;place-items:center;font:700 11.5px var(--mono);color:var(--text)}
  .st.bad .num{border-color:var(--bad)} .st.ok .num{border-color:var(--ok)}
  .st h2{font-size:15.5px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .st .why{font-size:13px;color:var(--muted);margin:0 0 10px}
  .qs{display:flex;flex-wrap:wrap;gap:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .rk{font:600 12px var(--mono);white-space:nowrap} .rk td{padding:4px 6px;white-space:nowrap}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mcol .it{padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;font-size:13px;transition:.15s}
  .mcol .it.hl{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(34,211,238,.25)}
  svg.ch{width:100%;height:210px;display:block}
  .tabs2{display:flex;gap:6px;margin:18px 0 12px}
  @media (max-width:900px){.ctl{grid-template-columns:1fr}.modes{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i>V</i>Vidya <small>RAG Lab</small></div>
  <nav class="nav"><a href="/" data-t="study"></a><a href="/lab" class="on" data-t="lab"></a></nav>
  <div class="sp"></div>
  <input class="in" id="appkey" type="password" autocomplete="off" data-tp="appKey" style="width:180px;padding:6px 10px;font-size:13px">
  <button class="btn sm" onclick="toggleLang()"><i data-i="globe" data-s="14"></i><span data-t="langBtn"></span></button>
  <button class="btn icon ghost" id="themeBtn"><i data-i="theme"></i></button>
</header>

<div class="wrap">
  <div class="card">
    <div class="h" data-t="arch"></div>
    <div class="arch" id="arch">
      <div class="node" data-k="q">Question<small>bn / en / banglish</small></div><span class="arr">→</span>
      <div class="node" data-k="rewrite">Query rewrite<small>multi-query + HyDE</small></div><span class="arr">→</span>
      <div class="node" data-k="dense">Dense<small>gemini-embedding</small></div><span class="arr">+</span>
      <div class="node" data-k="bm25">BM25<small>lexical</small></div><span class="arr">→</span>
      <div class="node" data-k="rrf">RRF fusion<small>k = 60</small></div><span class="arr">→</span>
      <div class="node" data-k="rerank">Rerank<small>LLM judge</small></div><span class="arr">→</span>
      <div class="node" data-k="grade">Corrective grade<small>drop irrelevant</small></div><span class="arr">→</span>
      <div class="node" data-k="generate">Grounded answer<small>cited</small></div><span class="arr">→</span>
      <div class="node" data-k="verify">Claim verify<small>NLI filter</small></div><span class="arr">→</span>
      <div class="node" data-k="clip">Segments / clip<small>ffmpeg</small></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="ctl">
      <select class="in" id="lib"></select>
      <input class="in" id="q" data-tp="labQ">
      <button class="btn pri" id="runBtn"><i data-i="play" data-s="14"></i><span data-t="run"></span></button>
    </div>
    <div class="acts">
      <button class="btn" id="cmpBtn"><i data-i="scale" data-s="14"></i><span data-t="cmp"></span></button>
      <button class="btn" id="chkBtn"><i data-i="scissors" data-s="14"></i><span data-t="chunkBtn"></span></button>
      <label class="tog"><input type="checkbox" id="rw"><span data-t="rwToggle"></span></label>
      <span class="sp"></span><span class="muted" data-t="realData"></span>
    </div>
  </div>

  <div id="out" style="margin-top:16px"></div>

  <div class="card" style="margin-top:22px">
    <div class="row" style="justify-content:space-between"><div class="h" style="margin:0" data-t="evalT"></div><span class="muted" data-t="evalHint"></span></div>
    <textarea class="in" id="evalset" rows="5" style="margin-top:10px;font:12.5px var(--mono)" placeholder='[{"video":"id","question":"...","gold":[120,240]}, {"video":"id","question":"না-থাকা topic","gold":null}]'></textarea>
    <div class="acts"><label class="tog"><input type="checkbox" id="full"><span data-t="e2e"></span></label><span class="sp"></span><button class="btn pri" id="evalBtn" data-t="runEval"></button></div>
    <div id="evalout" style="margin-top:12px"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
applyLang();applyIcons();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const rng=r=>fmt(r.start)+"–"+fmt(r.end);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const setTheme=t=>{document.documentElement.dataset.theme=t;store.set("theme",t)}; setTheme(store.get("theme")||"dark");
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("appkey").value=store.get("appkey")||""; $("appkey").onchange=()=>{store.set("appkey",$("appkey").value);loadLib()};
const hdr=()=>({"Content-Type":"application/json","x-app-key":$("appkey").value});
async function post(p,b){const r=await fetch(p,{method:"POST",headers:hdr(),credentials:"same-origin",body:JSON.stringify(b)});if(r.status===401){const j=await r.clone().json().catch(()=>({}));if(j.login)location.href="/"}const d=await r.json().catch(()=>({detail:"bad response"}));if(!r.ok)throw new Error(d.detail||r.status);return d}
async function get(p){const r=await fetch(p,{headers:hdr(),credentials:"same-origin"});if(r.status===401){const j=await r.clone().json().catch(()=>({}));if(j.login)location.href="/"}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.status);return d}
const vid=()=>$("lib").value;
const busy=m=>{$("out").innerHTML='<div class="card"><div class="row"><span class="spin"></span><b>'+m+'</b></div><div class="shimmer"></div><div class="shimmer" style="width:70%"></div><div class="shimmer" style="width:40%"></div></div>'};
const fail=e=>{$("out").innerHTML='<div class="card" style="border-color:var(--bad)"><span class="badge bad">Error</span> '+esc(e.message)+"</div>"};
async function loadLib(){let d;try{d=await get("/api/library")}catch(e){$("lib").innerHTML='<option value="">উপরে App key দাও ('+esc(e.message)+')</option>';return}
  $("lib").innerHTML=d.videos.map(v=>'<option value="'+esc(v.video_id)+'">'+esc(v.title)+" ("+fmt(v.duration)+")</option>").join("");
  if(!$("evalset").value&&d.videos.length)$("evalset").placeholder='[{"video":"'+d.videos[0].video_id+'","question":"...","gold":[120,240]}, {"video":"'+d.videos[0].video_id+'","question":"না-থাকা topic","gold":null}]'}
loadLib();
const lit=ks=>document.querySelectorAll("#arch .node").forEach(n=>n.classList.toggle("lit",ks.includes(n.dataset.k)));
let litTimer=null;
function animateArch(){const seq=["q","rewrite","dense","bm25","rrf","rerank","grade","generate","verify","clip"];let i=0;clearInterval(litTimer);litTimer=setInterval(()=>{lit(seq.slice(0,(i++%seq.length)+1))},650)}
function stopArch(ks){clearInterval(litTimer);lit(ks)}

function st(n,title,why,body,cls,badges){return '<div class="st fade '+(cls||"")+'"><div class="num">'+n+'</div><div class="card"><h2>'+title+(badges||"")+'</h2><p class="why">'+why+"</p>"+body+"</div></div>"}
const bars=(rows,key,lbl)=>{const m=Math.max(1e-9,...rows.map(r=>Math.abs(r[key])));return '<table class="t rk">'+rows.map(r=>"<tr><td>#"+r.idx+"</td><td>"+rng(r)+'</td><td style="width:55%"><span class="bar" style="width:'+Math.max(4,Math.round(100*Math.abs(r[key])/m))+'%"></span></td><td>'+r[key]+"</td></tr>").join("")+"</table>"};

$("runBtn").onclick=async()=>{
  if(!vid()||!$("q").value.trim())return; busy("Pipeline চলছে — ৫-৭টা LLM call…"); animateArch();
  try{
    const d=await post("/api/ask",{video_id:vid(),question:$("q").value,clip:false,debug:true});
    const t=d.trace,dbg=t.debug||{attempts:[]},tm=t.timings_ms||{},u=t.usage||{};
    const total=Object.values(tm).reduce((a,b)=>a+b,0);
    let h='<div class="stats">'+[
      [d.found?"found":"not found","result"],[(total/1000).toFixed(1)+"s","total latency"],[u.llm_calls||0,"LLM calls"],
      [(u.embed_calls||0)+" / "+(u.embed_texts||0),"embed calls / texts"],[t.attempts.length,"retrieval attempts"],
      [d.found?(t.claims_supported+"/"+t.claims_total):"—","claims verified"]].map(([b,s])=>'<div class="stat"><b>'+b+"</b><span>"+s+"</span></div>").join("")+'</div><div class="flow">';
    dbg.attempts.forEach((a,i)=>{
      const A=dbg.attempts.length>1?" · attempt "+(i+1):"";
      h+=st("1"+(A?String.fromCharCode(97+i):""),"Query understanding"+A,i?"প্রথমবার কিছু relevant পাওয়া যায়নি → broader query আর বড় k ("+a.k+") দিয়ে corrective retry।":"এক প্রশ্ন থেকে কয়েকটা query: Bangla, English, technical term, sub-question আর HyDE (hypothetical answer) — Banglish/noisy caption-এর সাথে মেলানোর জন্য।",
        '<div class="qs">'+a.queries.map((q,j)=>'<span class="badge'+(j===a.queries.length-1&&a.queries.length>2?" warn":"")+'">'+esc(q)+"</span>").join("")+"</div>","",'<span class="badge">'+a.queries.length+" queries</span>");
      const R=a.rankings||[];
      h+=st("2"+(A?String.fromCharCode(97+i):""),"Hybrid retrieval"+A,"প্রতিটা query-র জন্য dense (meaning) আর BM25 (exact শব্দ) আলাদা ranking — তারপর Reciprocal Rank Fusion।",
        '<div class="grid2">'+R.map(r=>'<div><div class="row" style="margin-bottom:6px"><span class="badge'+(r.kind==="bm25"?" warn":"")+'">'+r.kind+'</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">'+esc(r.query)+"</span></div>"+bars(r.top,"score")+"</div>").join("")+"</div>"+
        '<div style="margin-top:14px"><div class="h">RRF fusion → top candidates</div>'+bars(a.fused||[],"rrf")+"</div>"+
        (a.rerank?'<div style="margin-top:12px"><div class="h">Rerank ('+esc(a.rerank.provider)+')</div><div class="row">'+a.rerank.before.map(x=>'<span class="badge">#'+x+"</span>").join("")+'</div><div style="margin:6px 0;color:var(--muted)">↓</div><div class="row">'+a.rerank.after.map((x,j)=>'<span class="badge '+(a.rerank.before.indexOf(x)>j?"ok":a.rerank.before.indexOf(x)<j?"warn":"")+'">#'+x+"</span>").join("")+"</div></div>":""),"",'<span class="badge">'+R.length+" rankings</span>");
      const kept=a.graded.filter(x=>x.relevant).length;
      h+=st("3"+(A?String.fromCharCode(97+i):""),"Corrective grading"+A,"LLM relevance judge প্রতিটা candidate দেখে — শুধু keyword মিললে বাদ। এটাই hallucination-এর প্রথম দেয়াল।",
        '<table class="t">'+a.graded.map(x=>"<tr><td class='rk'>#"+x.idx+"</td><td class='rk'>"+rng(x)+'</td><td><span class="badge '+(x.relevant?"ok":"bad")+'">'+(x.relevant?"relevant":"dropped")+'</span></td><td style="color:var(--text2)">'+esc(x.preview)+"</td></tr>").join("")+"</table>",kept?"ok":"bad",'<span class="badge '+(kept?"ok":"bad")+'">'+kept+"/"+a.graded.length+" kept</span>");
    });
    if(!d.found){h+=st("!","Result: not in video","দুই attempt-এই relevant কিছু নেই → hallucinate না করে সৎভাবে “নেই”।",'<b>'+esc(d.message)+"</b>","bad");stopArch(["q","rewrite","dense","bm25","rrf","rerank","grade"])}
    else{
      h+=st(4,"Evidence","LLM শুধু এই passage-গুলোই দেখে (numbered, সময়সহ)।",'<table class="t">'+dbg.evidence.map(x=>"<tr><td class='rk'>["+x.n+"]</td><td class='rk'>"+rng(x)+"</td><td style='color:var(--text2)'>"+esc(x.text)+"</td></tr>").join("")+"</table>");
      const raw=dbg.answer_before_verify||{sections:[]};
      h+=st(5,"Grounded generation","প্রতিটা point-কে evidence নম্বর cite করতে হয়; outside knowledge নিষেধ।",(raw.sections||[]).map(s=>"<b>"+esc(s.heading)+"</b><ul>"+(s.points||[]).map(p=>"<li>"+esc(p.text||p)+" <span class='badge'>cites "+esc(JSON.stringify(p.cites||[]))+"</span></li>").join("")+"</ul>").join(""));
      h+=st(6,"Claim verification","প্রতিটা claim তার cited evidence দিয়ে যাচাই (NLI-style)। Unsupported হলে final answer থেকে বাদ।",
        '<table class="t">'+(t.claims||[]).map(x=>'<tr><td><span class="badge '+(x.verdict==="supported"?"ok":x.verdict==="unverified"?"warn":"bad")+'">'+esc(x.verdict)+"</span></td><td>"+esc(x.text)+"</td></tr>").join("")+"</table>",t.claims_supported<t.claims_total?"":"ok",'<span class="badge '+(t.verify==="ok"?"ok":"warn")+'">'+t.claims_supported+"/"+t.claims_total+" · "+esc(t.verify)+"</span>");
      h+=st(7,"Final answer + segments","Verified points + merged time ranges (clip/embed)।",(d.answer?"<b>"+esc(d.answer.title)+"</b><p style='color:var(--text2)'>"+esc(d.answer.summary)+"</p>":esc(d.note))+'<div class="row">'+d.segments.map(s=>'<a class="badge" target="_blank" href="'+esc(s.url)+'">'+ic("play",10)+' '+rng(s)+"</a>").join("")+"</div>","ok");
      stopArch(["q","rewrite","dense","bm25","rrf","rerank","grade","generate","verify","clip"]);
    }
    const mx=Math.max(1,...Object.values(tm));
    h+=st("Σ","Latency breakdown","কোন ধাপে কত সময় গেল (ms)।",'<table class="t">'+Object.entries(tm).map(([k,v])=>'<tr><td style="width:120px">'+k+'</td><td><span class="bar" style="width:'+Math.max(2,Math.round(100*v/mx))+'%"></span></td><td class="rk" style="width:80px">'+v+"</td></tr>").join("")+"</table>"+'<div class="muted" style="margin-top:8px">LLM in/out chars: '+(u.llm_in_chars||0)+" / "+(u.llm_out_chars||0)+(u.llm_fallbacks?" · model fallbacks: "+u.llm_fallbacks:"")+"</div>");
    $("out").innerHTML=h+"</div>";
  }catch(e){stopArch([]);fail(e)}
};

$("cmpBtn").onclick=async()=>{
  if(!vid()||!$("q").value.trim())return; busy("চারটা retrieval mode চলছে…");
  try{
    const d=await post("/api/lab/compare",{video_id:vid(),question:$("q").value,use_rewrite:$("rw").checked});
    let h='<div class="card fade"><div class="row" style="justify-content:space-between"><div class="h" style="margin:0">Retrieval mode তুলনা · top-5</div><span class="muted">একটা chunk-এ hover করো — অন্য mode-এ সেটা কোথায় দেখো</span></div><div class="modes" style="margin-top:12px">';
    for(const [m,v] of Object.entries(d.modes)){
      h+='<div class="mcol"><div class="row" style="margin-bottom:8px"><span class="badge">'+esc(m)+'</span><span class="muted">'+v.ms+" ms</span></div>"+v.results.map((r,i)=>'<div class="it" data-i="'+r.idx+'"><b class="rk">'+(i+1)+". #"+r.idx+"</b> <span class='muted rk'>"+rng(r)+"</span><div style='color:var(--text2);margin-top:3px'>"+esc(r.preview)+"</div></div>").join("")+"</div>";
    }
    $("out").innerHTML=h+'</div><p class="muted" style="margin:12px 0 0">dense = অর্থ মেলায় · bm25 = হুবহু শব্দ · hybrid = দুটোর RRF · rerank = LLM দিয়ে পুনর্বিন্যাস</p></div>';
    document.querySelectorAll(".it").forEach(el=>{el.onmouseenter=()=>document.querySelectorAll('.it[data-i="'+el.dataset.i+'"]').forEach(x=>x.classList.add("hl"));el.onmouseleave=()=>document.querySelectorAll(".it.hl").forEach(x=>x.classList.remove("hl"))});
  }catch(e){fail(e)}
};

$("chkBtn").onclick=async()=>{
  if(!vid())return; busy("Chunking data আনছি…");
  try{
    const d=await get("/api/lab/chunks/"+vid()); const c=d.chunking,sims=c.sims||[];
    let svg="";
    if(sims.length){
      const W=1000,H=180,mx=Math.max(...sims,0.01),n=sims.length,bw=W/n;
      svg+='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".5"/></linearGradient></defs>';
      sims.forEach((s,i)=>{svg+='<rect x="'+(i*bw)+'" y="'+(H-H*s/mx)+'" width="'+Math.max(bw-1,0.6)+'" height="'+(H*s/mx)+'" fill="url(#g)" rx="1.5"><title>'+s+"</title></rect>"});
      (c.boundaries||[]).forEach(b=>{svg+='<line x1="'+((b+0.5)*bw)+'" x2="'+((b+0.5)*bw)+'" y1="0" y2="'+H+'" stroke="#22c55e" stroke-width="1.5" opacity=".8"/>'});
      svg+='<line x1="0" x2="'+W+'" y1="'+(H-H*c.thr/mx)+'" y2="'+(H-H*c.thr/mx)+'" stroke="#f43f5e" stroke-dasharray="6 4" stroke-width="1.5"/>';
    }
    const durs=d.chunks.map(x=>x.end-x.start),avg=durs.reduce((a,b)=>a+b,0)/Math.max(1,durs.length);
    $("out").innerHTML='<div class="stats"><div class="stat"><b>'+d.chunks.length+'</b><span>chunks</span></div><div class="stat"><b>'+Math.round(avg)+'s</b><span>avg chunk</span></div><div class="stat"><b>'+c.thr+'</b><span>threshold (mean − '+c.k+'σ)</span></div><div class="stat"><b>'+c.min_dur+"–"+c.max_dur+'s</b><span>min / max</span></div><div class="stat"><b>'+esc(c.signal)+'</b><span>signal</span></div></div>'+
      '<div class="card fade"><div class="h">Topic-shift curve — '+esc(d.title)+'</div><svg class="ch" viewBox="0 0 1000 185" preserveAspectRatio="none">'+svg+'</svg><div class="row muted" style="margin-top:6px;gap:16px"><span>▮ পাশাপাশি অংশের similarity</span><span style="color:#f43f5e">- - threshold</span><span style="color:#22c55e">| chunk boundary</span><span>(নিচে নামলে topic বদলাচ্ছে)</span></div></div>'+
      '<div class="card fade" style="margin-top:12px"><table class="t">'+d.chunks.map(x=>"<tr><td class='rk'>#"+x.i+"</td><td class='rk'>"+rng(x)+"</td><td class='muted'>"+x.n_segs+" segs · "+x.chars+" chars</td><td style='color:var(--text2)'>"+esc(x.preview)+"</td></tr>").join("")+"</table></div>";
  }catch(e){fail(e)}
};

$("evalBtn").onclick=async()=>{
  $("evalout").innerHTML='<div class="row"><span class="spin"></span><span class="muted">Eval চলছে…</span></div>';
  try{
    const d=await post("/api/lab/eval",{items:JSON.parse($("evalset").value),full:$("full").checked});
    let h='<table class="t"><tr><th>config</th><th>Hit@5</th><th></th><th>MRR</th><th>avg ms</th><th>n</th></tr>'+Object.entries(d.retrieval).map(([k,v])=>"<tr><td><b>"+esc(k)+"</b></td><td class='rk'>"+v["Hit@k"].toFixed(2)+'</td><td style="width:35%"><span class="bar" style="width:'+Math.max(2,Math.round(100*v["Hit@k"]))+'%"></span></td><td class="rk">'+v.MRR.toFixed(2)+"</td><td class='rk'>"+v.avg_ms+"</td><td class='rk'>"+v.n+"</td></tr>").join("")+"</table>";
    if(d.end_to_end){h+='<div class="grid2" style="margin-top:14px">'+Object.entries(d.end_to_end).map(([k,v])=>'<div class="card soft"><div class="h">'+esc(k)+"</div>"+(typeof v==="object"?'<table class="t">'+Object.entries(v).map(([a,b])=>"<tr><td>"+esc(a)+"</td><td class='rk'>"+esc(typeof b==="number"?(+b.toFixed(3)):JSON.stringify(b))+"</td></tr>").join("")+"</table>":esc(v))+"</div>").join("")+"</div>"}
    $("evalout").innerHTML=h;
  }catch(e){$("evalout").innerHTML='<span class="badge bad">'+esc(e.message)+"</span>"}
};
$("q").onkeydown=e=>{if(e.key==="Enter")$("runBtn").click()};
</script>
</body>
</html>
