<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Lab — Learning Mate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui.css?v=20261001">
<script src="/static/i18n.js?v=20261001"></script>
<script src="/static/icons.js?v=20261001"></script>
<style>
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
  .ctl{display:grid;grid-template-columns:minmax(220px,1.1fr) 2fr auto;gap:10px;align-items:center}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .arch{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0 2px}
  .node{flex:none;padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:650;text-align:center;min-width:92px;transition:.2s}
  .node small{display:block;font:500 10.5px var(--mono);color:var(--muted);margin-top:2px}
  .node.lit{border-color:var(--brand);background:var(--brandSoft);box-shadow:0 0 18px rgba(124,92,255,.35)}
  .arr{color:var(--muted);flex:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px} .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:650}
  .flow{position:relative;padding-left:34px}
  .flow::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--brand),var(--brand2))}
  .st{position:relative;margin-bottom:14px}
  .st .num{position:absolute;left:-34px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--panel);border:2px solid var(--brand);display:grid;place-items:center;font:700 11.5px var(--mono);color:var(--text)}
  .st.bad .num{border-color:var(--bad)} .st.ok .num{border-color:var(--ok)}
  .st h2{font-size:15.5px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .st .why{font-size:13px;color:var(--muted);margin:0 0 10px}
  .qs{display:flex;flex-wrap:wrap;gap:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .rk{font:600 12px var(--mono);white-space:nowrap} .rk td{padding:4px 6px;white-space:nowrap}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mcol .it{padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;font-size:13px;transition:.15s}
  .mcol .it.hl{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(34,211,238,.25)}
  svg.ch{width:100%;height:210px;display:block}
  .tabs2{display:flex;gap:6px;margin:18px 0 12px}
  @media (max-width:900px){.ctl{grid-template-columns:1fr}.modes{grid-template-columns:1fr 1fr}}
  .ltabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .ltabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font:650 14px var(--font);cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;gap:7px;align-items:center}
  .ltabs button.on{color:var(--text);border-bottom-color:var(--brand)}
  .evrow{display:grid;grid-template-columns:190px 1fr 70px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .evrow:last-child{border-bottom:0} .evrow.best b{color:var(--brand2)}
  .evbars{display:flex;flex-direction:column;gap:5px}
  .evbar{display:flex;align-items:center;gap:8px;font:600 12px var(--mono)} .evbar i{display:block;height:10px;border-radius:6px;min-width:3px}
  .evbar.h i{background:linear-gradient(90deg,#7c5cff,#a78bfa)} .evbar.m i{background:linear-gradient(90deg,#0891b2,#22d3ee)}
  .evleg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:6px 0 4px} .evleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .evleg .h::before{background:#7c5cff} .evleg .m::before{background:#22d3ee}
  .why{margin:10px 0 0;padding-left:18px;color:var(--text2)} .why li{margin:5px 0}
  details.cust summary{cursor:pointer;color:var(--text2);font-weight:600}
  @media (max-width:780px){
    .evrow{grid-template-columns:1fr;gap:6px}
    .top{gap:6px;padding:8px 10px} .top>*{flex:none} .top .sp{flex:1} .logo{font-size:16px;white-space:nowrap} .logo small,#health{display:none} .nav{margin-left:0} .nav a{padding:5px 8px;font-size:13px;white-space:nowrap} .top .btn{height:36px;padding:0 10px} .logo span{display:none} #appkey{width:110px!important}
    .wrap{padding:14px 12px 40px} .in,textarea.in,select.in{font-size:16px}
    .modes{grid-template-columns:1fr} .grid2{grid-template-columns:1fr}
    table.t{display:block;overflow-x:auto;max-width:100%} table.t td{min-width:44px}
  }
  @media (max-width:420px){.logo span{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i>L</i><span data-t="brand"></span> <small>RAG Lab</small></div>
  <nav class="nav"><a href="/" data-t="study"></a><a href="/lab" class="on" data-t="lab"></a></nav>
  <div class="sp"></div>
  <input class="in hide" id="appkey" type="password" autocomplete="off" data-tp="appKey" style="width:180px;padding:6px 10px;font-size:13px">
  <button class="btn sm" onclick="toggleLang()"><i data-i="globe" data-s="14"></i><span data-t="langBtn"></span></button>
  <button class="btn icon ghost" id="themeBtn"><i data-i="theme"></i></button>
</header>

<div class="wrap">
  <div class="ltabs" id="ltabs">
    <button data-lt="pipe" class="on"><i data-i="layers" data-s="15"></i><span data-t="labTabPipe"></span></button>
    <button data-lt="eval"><i data-i="gauge" data-s="15"></i><span data-t="labTabEval"></span></button>
  </div>
  <div id="lt_pipe">
  <div class="card">
    <div class="h" data-t="arch"></div>
    <div class="arch" id="arch">
      <div class="node" data-k="q"><span data-t="a_q"></span><small>bn / en / banglish</small></div><span class="arr">→</span>
      <div class="node" data-k="rewrite"><span data-t="a_rw"></span><small>multi-query + HyDE</small></div><span class="arr">→</span>
      <div class="node" data-k="dense"><span data-t="a_dense"></span><small>gemini-embedding</small></div><span class="arr">+</span>
      <div class="node" data-k="bm25"><span data-t="a_bm25"></span><small>BM25</small></div><span class="arr">→</span>
      <div class="node" data-k="rrf"><span data-t="a_rrf"></span><small>k = 60</small></div><span class="arr">→</span>
      <div class="node" data-k="rerank"><span data-t="a_rr"></span><small>LLM judge</small></div><span class="arr">→</span>
      <div class="node" data-k="grade"><span data-t="a_gr"></span><small>corrective RAG</small></div><span class="arr">→</span>
      <div class="node" data-k="generate"><span data-t="a_gen"></span><small>cited</small></div><span class="arr">→</span>
      <div class="node" data-k="verify"><span data-t="a_ver"></span><small>NLI filter</small></div><span class="arr">→</span>
      <div class="node" data-k="clip"><span data-t="a_seg"></span><small>timestamps</small></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="ctl">
      <select class="in" id="lib"></select>
      <input class="in" id="q" data-tp="labQ">
      <button class="btn pri" id="runBtn"><i data-i="play" data-s="14"></i><span data-t="run"></span></button>
    </div>
    <div class="acts">
      <button class="btn" id="cmpBtn"><i data-i="scale" data-s="14"></i><span data-t="cmp"></span></button>
      <button class="btn" id="chkBtn"><i data-i="scissors" data-s="14"></i><span data-t="chunkBtn"></span></button>
      <label class="tog"><input type="checkbox" id="rw"><span data-t="rwToggle"></span></label>
      <span class="sp"></span><span class="muted" data-t="realData"></span>
    </div>
  </div>

  <div id="out" style="margin-top:16px"></div>
  </div>

  <div id="lt_eval" class="hide">
  <div class="card">
    <div class="h" style="margin:0 0 4px" data-t="evSaved"></div>
    <div class="muted" data-t="evSavedD"></div>
    <div class="evleg"><span class="h">Hit@5</span><span class="m">MRR</span><span>avg ms</span></div>
    <div id="evSaved"></div>
    <div class="h" style="margin:14px 0 0" data-t="evWhy"></div>
    <ul class="why"><li data-t="evWhy1"></li><li data-t="evWhy2"></li><li data-t="evWhy3"></li></ul>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
      <div><div class="h" style="margin:0 0 4px" data-t="evBuiltin"></div><div class="muted" data-t="evBuiltinD"></div><div class="muted" id="evInfo" style="margin-top:6px"></div></div>
      <button class="btn pri" id="evQuick"><i data-i="play" data-s="14"></i><span data-t="evQuick"></span></button>
    </div>
    <div id="evLive" style="margin-top:12px"></div>
  </div>
  <div class="card" style="margin-top:14px">
  <details class="cust"><summary data-t="evCustom"></summary>
    <div class="row" style="justify-content:space-between;margin-top:10px"><div class="h" style="margin:0" data-t="evalT"></div><span class="muted" data-t="evalHint"></span></div>
    <textarea class="in" id="evalset" rows="5" style="margin-top:10px;font:12.5px var(--mono)" placeholder='[{"video":"id","question":"...","gold":[120,240]}, {"video":"id","question":"topic NOT in the video","gold":null}]'></textarea>
    <div class="acts"><label class="tog"><input type="checkbox" id="full"><span data-t="e2e"></span></label><span class="sp"></span><button class="btn pri" id="evalBtn" data-t="runEval"></button></div>
    <div id="evalout" style="margin-top:12px"></div>
  </details>
  </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
applyLang();applyIcons();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>{x=Math.max(0,Math.floor(x||0));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const rng=r=>fmt(r.start)+"–"+fmt(r.end);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const setTheme=x=>{document.documentElement.dataset.theme=x;store.set("theme",x)};setTheme(store.get("theme")||"dark");
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("appkey").value=store.get("appkey")||"";fetch("/api/auth/me",{credentials:"same-origin"}).then(r=>r.json()).then(d=>{if(!d.auth&&d.app_password)$("appkey").classList.remove("hide")}).catch(()=>{});$("appkey").onchange=()=>{store.set("appkey",$("appkey").value);loadLib()};
const hdr=()=>({"Content-Type":"application/json","x-app-key":$("appkey").value,"x-lang":LANG});
let triedGuest=false;
async function req(p,o){let r=await fetch(p,{headers:hdr(),credentials:"same-origin",...o});
  if(r.status===401&&!triedGuest){triedGuest=true;const g=await fetch("/api/auth/guest",{method:"POST",credentials:"same-origin"}).catch(()=>null);if(g&&g.ok)r=await fetch(p,{headers:hdr(),credentials:"same-origin",...o})}
  const d=await r.json().catch(()=>({detail:"bad response"}));if(r.status===401&&d.login)location.href="/";if(!r.ok)throw new Error(tMsg(d.detail||r.status));return d}
const post=(p,b)=>req(p,{method:"POST",body:JSON.stringify(b)}),get=p=>req(p);
const vid=()=>$("lib").value;
const busy=k=>{$("out").innerHTML='<div class="card"><div class="row"><span class="spin"></span><b>'+t(k)+'</b></div><div class="shimmer"></div><div class="shimmer" style="width:70%"></div><div class="shimmer" style="width:40%"></div></div>'};
const fail=e=>{$("out").innerHTML='<div class="card" style="border-color:var(--bad)"><span class="badge bad">'+t("error")+"</span> "+esc(e.message)+"</div>"};
let libVideos=[];
async function loadLib(){try{libVideos=(await get("/api/library")).videos}catch(e){$("lib").innerHTML='<option value="">'+esc(t("noKey"))+"</option>";return}
  const keep=$("lib").value;$("lib").innerHTML=libVideos.map(v=>'<option value="'+esc(v.video_id)+'">'+esc(v.title)+" ("+fmt(v.duration)+")</option>").join("");if(keep)$("lib").value=keep;
  if(libVideos.length)$("evalset").placeholder='[{"video":"'+libVideos[0].video_id+'","question":"...","gold":[120,240]}, {"video":"'+libVideos[0].video_id+'","question":"topic NOT in the video","gold":null}]'}
loadLib();
const lit=ks=>document.querySelectorAll("#arch .node").forEach(n=>n.classList.toggle("lit",ks.includes(n.dataset.k)));
let litTimer=null;const SEQ=["q","rewrite","dense","bm25","rrf","rerank","grade","generate","verify","clip"];
function animateArch(){let i=0;clearInterval(litTimer);litTimer=setInterval(()=>lit(SEQ.slice(0,(i++%SEQ.length)+1)),650)}
function stopArch(ks){clearInterval(litTimer);lit(ks)}
const st=(n,title,why,body,cls,badges)=>'<div class="st fade '+(cls||"")+'"><div class="num">'+n+'</div><div class="card"><h2>'+title+(badges||"")+'</h2><p class="why">'+why+"</p>"+body+"</div></div>";
const bars=(rows,key)=>{const m=Math.max(1e-9,...rows.map(r=>Math.abs(r[key])));return '<table class="t rk">'+rows.map(r=>"<tr><td>#"+r.idx+"</td><td>"+rng(r)+'</td><td style="width:55%"><span class="bar" style="width:'+Math.max(4,Math.round(100*Math.abs(r[key])/m))+'%"></span></td><td>'+r[key]+"</td></tr>").join("")+"</table>"};

$("runBtn").onclick=async()=>{
  if(!vid()||!$("q").value.trim())return;busy("labBusyRun");animateArch();
  try{
    const d=await post("/api/ask",{video_id:vid(),question:$("q").value,clip:false,debug:true});
    const tr=d.trace,dbg=tr.debug||{attempts:[]},tm=tr.timings_ms||{},u=tr.usage||{},total=Object.values(tm).reduce((a,b)=>a+b,0);
    let h='<div class="stats">'+[[d.found?t("sFound"):t("sNotFound"),t("sResult")],[(total/1000).toFixed(1)+"s",t("sLatency")],[u.llm_calls||0,t("sLlm")],
      [(u.embed_calls||0)+" / "+(u.embed_texts||0),t("sEmb")],[tr.attempts.length,t("sAttempts")],[d.found?(tr.claims_supported+"/"+tr.claims_total):"—",t("sClaims")]].map(([b,x])=>'<div class="stat"><b>'+b+"</b><span>"+x+"</span></div>").join("")+'</div><div class="flow">';
    dbg.attempts.forEach((a,i)=>{
      const A=dbg.attempts.length>1?" · "+t("attempt")+" "+(i+1):"",sfx=A?String.fromCharCode(97+i):"";
      h+=st("1"+sfx,t("s1")+A,i?t("s1retry",{k:a.k}):t("s1why"),'<div class="qs">'+a.queries.map((q,j)=>'<span class="badge'+(j===a.queries.length-1&&a.queries.length>2?" warn":"")+'">'+esc(q)+"</span>").join("")+"</div>","",'<span class="badge">'+a.queries.length+" queries</span>");
      const R=a.rankings||[];
      h+=st("2"+sfx,t("s2")+A,t("s2why"),'<div class="grid2">'+R.map(r=>'<div><div class="row" style="margin-bottom:6px"><span class="badge'+(r.kind==="bm25"?" warn":"")+'">'+r.kind+'</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">'+esc(r.query)+"</span></div>"+(r.top.length?bars(r.top,"score"):'<div class="muted">—</div>')+"</div>").join("")+"</div>"+
        (a.dense_error?'<div class="muted" style="margin-top:8px">dense: '+esc(a.dense_error)+"</div>":"")+
        '<div style="margin-top:14px"><div class="h">'+t("s2fused")+"</div>"+bars(a.fused||[],"rrf")+"</div>"+
        (a.rerank?'<div style="margin-top:12px"><div class="h">'+t("s2rerank")+" ("+esc(a.rerank.provider)+')</div><div class="row">'+a.rerank.before.map(x=>'<span class="badge">#'+x+"</span>").join("")+'</div><div style="margin:6px 0;color:var(--muted)">↓</div><div class="row">'+a.rerank.after.map((x,j)=>'<span class="badge '+(a.rerank.before.indexOf(x)>j?"ok":a.rerank.before.indexOf(x)<j?"warn":"")+'">#'+x+"</span>").join("")+"</div></div>":""),"",'<span class="badge">'+R.length+" rankings</span>");
      const kept=a.graded.filter(x=>x.relevant).length;
      h+=st("3"+sfx,t("s3")+A,t("s3why"),'<table class="t">'+a.graded.map(x=>"<tr><td class='rk'>#"+x.idx+"</td><td class='rk'>"+rng(x)+'</td><td><span class="badge '+(x.relevant?"ok":"bad")+'">'+(x.relevant?t("relevant"):t("dropped"))+'</span></td><td style="color:var(--text2)">'+esc(x.preview)+"</td></tr>").join("")+"</table>",kept?"ok":"bad",'<span class="badge '+(kept?"ok":"bad")+'">'+kept+"/"+a.graded.length+" "+t("s3kept")+"</span>");
    });
    if(!d.found){h+=st("!",t("sNo"),t("sNoWhy"),"<b>"+esc(t("notFoundMsg"))+"</b>","bad");stopArch(SEQ.slice(0,7))}
    else{
      h+=st(4,t("s4"),t("s4why"),'<table class="t">'+dbg.evidence.map(x=>"<tr><td class='rk'>["+x.n+"]</td><td class='rk'>"+rng(x)+"</td><td style='color:var(--text2)'>"+esc(x.text)+"</td></tr>").join("")+"</table>");
      const raw=dbg.answer_before_verify||{sections:[]};
      h+=st(5,t("s5"),t("s5why"),(raw.sections||[]).map(x=>"<b>"+esc(x.heading)+"</b><ul>"+(x.points||[]).map(p=>"<li>"+esc(p.text||p)+" <span class='badge'>"+t("cites")+" "+esc(JSON.stringify(p.cites||[]))+"</span></li>").join("")+"</ul>").join(""));
      h+=st(6,t("s6"),t("s6why"),'<table class="t">'+(tr.claims||[]).map(x=>'<tr><td><span class="badge '+(x.verdict==="supported"?"ok":x.verdict==="unverified"?"warn":"bad")+'">'+esc(x.verdict)+"</span></td><td>"+esc(x.text)+"</td></tr>").join("")+"</table>",tr.claims_supported<tr.claims_total?"":"ok",'<span class="badge '+(tr.verify==="ok"?"ok":"warn")+'">'+tr.claims_supported+"/"+tr.claims_total+"</span>");
      h+=st(7,t("s7"),t("s7why"),(d.answer?"<b>"+esc(d.answer.title)+"</b><p style='color:var(--text2)'>"+esc(d.answer.summary)+"</p>":esc(d.note))+'<div class="row">'+d.segments.map(x=>'<a class="badge" target="_blank" href="'+esc(x.url)+'">'+ic("play",10)+" "+rng(x)+"</a>").join("")+"</div>","ok");
      stopArch(SEQ);
    }
    const mx=Math.max(1,...Object.values(tm));
    h+=st("Σ",t("sT"),t("sTwhy"),'<table class="t">'+Object.entries(tm).map(([k,v])=>'<tr><td style="width:120px">'+k+'</td><td><span class="bar" style="width:'+Math.max(2,Math.round(100*v/mx))+'%"></span></td><td class="rk" style="width:80px">'+v+"</td></tr>").join("")+"</table>"+'<div class="muted" style="margin-top:8px">'+t("inOut")+": "+(u.llm_in_chars||0)+" / "+(u.llm_out_chars||0)+(u.llm_fallbacks?" · model fallbacks: "+u.llm_fallbacks:"")+"</div>");
    $("out").innerHTML=h+"</div>";
  }catch(e){stopArch([]);fail(e)}
};

$("cmpBtn").onclick=async()=>{
  if(!vid()||!$("q").value.trim())return;busy("labBusyCmp");
  try{
    const d=await post("/api/lab/compare",{video_id:vid(),question:$("q").value,use_rewrite:$("rw").checked});
    let h='<div class="card fade"><div class="row" style="justify-content:space-between"><div class="h" style="margin:0">'+t("cmpT")+'</div><span class="muted">'+t("cmpHover")+'</span></div><div class="modes" style="margin-top:12px">';
    for(const [m,v] of Object.entries(d.modes))h+='<div class="mcol"><div class="row" style="margin-bottom:8px"><span class="badge">'+esc(m)+'</span><span class="muted">'+v.ms+" ms</span></div>"+v.results.map((r,i)=>'<div class="it" data-i="'+r.idx+'"><b class="rk">'+(i+1)+". #"+r.idx+"</b> <span class='muted rk'>"+rng(r)+"</span><div style='color:var(--text2);margin-top:3px'>"+esc(r.preview)+"</div></div>").join("")+"</div>";
    $("out").innerHTML=h+'</div><p class="muted" style="margin:12px 0 0">'+t("cmpLegend")+"</p></div>";
    document.querySelectorAll(".it").forEach(el=>{el.onmouseenter=()=>document.querySelectorAll('.it[data-i="'+el.dataset.i+'"]').forEach(x=>x.classList.add("hl"));el.onmouseleave=()=>document.querySelectorAll(".it.hl").forEach(x=>x.classList.remove("hl"))});
  }catch(e){fail(e)}
};

$("chkBtn").onclick=async()=>{
  if(!vid())return;busy("labBusyChunk");
  try{
    const d=await get("/api/lab/chunks/"+vid()),c=d.chunking,sims=c.sims||[];let svg="";
    if(sims.length){const W=1000,H=180,mx=Math.max(...sims,0.01),n=sims.length,bw=W/n;
      svg+='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".5"/></linearGradient></defs>';
      sims.forEach((x,i)=>{svg+='<rect x="'+(i*bw)+'" y="'+(H-H*x/mx)+'" width="'+Math.max(bw-1,0.6)+'" height="'+(H*x/mx)+'" fill="url(#g)" rx="1.5"><title>'+x+"</title></rect>"});
      (c.boundaries||[]).forEach(b=>{svg+='<line x1="'+((b+0.5)*bw)+'" x2="'+((b+0.5)*bw)+'" y1="0" y2="'+H+'" stroke="#22c55e" stroke-width="1.5" opacity=".8"/>'});
      svg+='<line x1="0" x2="'+W+'" y1="'+(H-H*c.thr/mx)+'" y2="'+(H-H*c.thr/mx)+'" stroke="#f43f5e" stroke-dasharray="6 4" stroke-width="1.5"/>'}
    const durs=d.chunks.map(x=>x.end-x.start),avg=durs.reduce((a,b)=>a+b,0)/Math.max(1,durs.length);
    $("out").innerHTML='<div class="stats">'+[[d.chunks.length,t("chN")],[Math.round(avg)+"s",t("chAvg")],[c.thr,t("chThr",{k:c.k})],[c.min_dur+"–"+c.max_dur+"s",t("chMinMax")],[esc(c.signal),t("chSig")]].map(([b,x])=>'<div class="stat"><b>'+b+"</b><span>"+x+"</span></div>").join("")+"</div>"+
      '<div class="card fade"><div class="h">'+t("chCurve")+" — "+esc(d.title)+'</div><svg class="ch" viewBox="0 0 1000 185" preserveAspectRatio="none">'+svg+'</svg><div class="row muted" style="margin-top:6px;gap:16px"><span>▮ '+t("chL1")+'</span><span style="color:#f43f5e">- - '+t("chL2")+'</span><span style="color:#22c55e">| '+t("chL3")+"</span><span>"+t("chL4")+"</span></div></div>"+
      '<div class="card fade" style="margin-top:12px"><table class="t">'+d.chunks.map(x=>"<tr><td class='rk'>#"+x.i+"</td><td class='rk'>"+rng(x)+"</td><td class='muted'>"+x.n_segs+" · "+x.chars+"</td><td style='color:var(--text2)'>"+esc(x.preview)+"</td></tr>").join("")+"</table></div>";
  }catch(e){fail(e)}
};

$("evalBtn").onclick=async()=>{
  $("evalout").innerHTML='<div class="row"><span class="spin"></span><span class="muted">'+t("labBusyEval")+"</span></div>";
  try{
    const d=await post("/api/lab/eval",{items:JSON.parse($("evalset").value),full:$("full").checked});
    let h='<table class="t"><tr><th>'+t("evCfg")+'</th><th>Hit@5</th><th></th><th>MRR</th><th>avg ms</th><th>n</th></tr>'+Object.entries(d.retrieval).map(([k,v])=>"<tr><td><b>"+esc(k)+"</b></td><td class='rk'>"+v["Hit@k"].toFixed(2)+'</td><td style="width:35%"><span class="bar" style="width:'+Math.max(2,Math.round(100*v["Hit@k"]))+'%"></span></td><td class="rk">'+v.MRR.toFixed(2)+"</td><td class='rk'>"+v.avg_ms+"</td><td class='rk'>"+v.n+"</td></tr>").join("")+"</table>";
    if(d.end_to_end)h+='<div class="grid2" style="margin-top:14px">'+Object.entries(d.end_to_end).map(([k,v])=>'<div class="card soft"><div class="h">'+esc(k)+'</div><table class="t">'+Object.entries(v).map(([a,b])=>"<tr><td>"+esc(a)+"</td><td class='rk'>"+esc(typeof b==="number"?(+b.toFixed(3)):JSON.stringify(b))+"</td></tr>").join("")+"</table></div>").join("")+"</div>";
    $("evalout").innerHTML=h;
  }catch(e){$("evalout").innerHTML='<span class="badge bad">'+esc(e.message)+"</span>"}
};
$("q").onkeydown=e=>{if(e.key==="Enter")$("runBtn").click()};
/* tabs */
document.querySelectorAll("#ltabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#ltabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("lt_pipe").classList.toggle("hide",b.dataset.lt!=="pipe");$("lt_eval").classList.toggle("hide",b.dataset.lt!=="eval");store.set("labTab",b.dataset.lt)});
if(store.get("labTab")==="eval")document.querySelector('#ltabs button[data-lt="eval"]').click();
/* evaluation charts */
const SAVED={"dense":{"Hit@k":1.00,"MRR":0.92,"avg_ms":576,"n":26},"bm25":{"Hit@k":0,"MRR":0,"avg_ms":0,"n":26},"hybrid":{"Hit@k":0.96,"MRR":0.86,"avg_ms":516,"n":26},
  "hybrid+rerank":{"Hit@k":1.00,"MRR":0.93,"avg_ms":1794,"n":26},"hybrid+rerank+rewrite":{"Hit@k":1.00,"MRR":0.86,"avg_ms":11528,"n":26}};
function evChart(res){const best=Object.entries(res).sort((a,b)=>(b[1].MRR+b[1]["Hit@k"])-(a[1].MRR+a[1]["Hit@k"]))[0][0];
  return Object.entries(res).map(([k,v])=>'<div class="evrow'+(k===best?" best":"")+'"><b style="font-family:var(--mono);font-size:13px">'+esc(k)+(k===best?" ★":"")+'</b><div class="evbars">'+
    '<div class="evbar h"><i style="width:'+(v["Hit@k"]*100)+'%"></i>'+v["Hit@k"].toFixed(2)+'</div><div class="evbar m"><i style="width:'+(v.MRR*100)+'%"></i>'+v.MRR.toFixed(2)+"</div></div>"+
    '<span class="muted" style="font:600 12px var(--mono);text-align:right">'+(v.avg_ms||0)+" ms</span></div>").join("")}
$("evSaved").innerHTML=evChart(SAVED);
let evItems=null;const nf=n=>n.toLocaleString(LANG==="bn"?"bn-BD":"en");
function evInfo(){if(evItems)$("evInfo").textContent=t("evLoaded",{p:nf(evItems.filter(x=>x.gold).length),n:nf(evItems.filter(x=>!x.gold).length)})}
async function loadEvalSet(){try{const d=await get("/api/lab/evalset");evItems=d.items;evInfo();
  if(!$("evalset").value.trim())$("evalset").value=JSON.stringify(d.items.slice(0,6))}catch(e){$("evInfo").textContent=e.message}}
loadEvalSet();
$("evQuick").onclick=async()=>{
  if(!evItems)await loadEvalSet();const pos=(evItems||[]).filter(x=>x.gold);if(!pos.length)return;
  const step=Math.max(1,Math.floor(pos.length/8)),pick=pos.filter((_,i)=>i%step===0).slice(0,8);
  $("evLive").innerHTML='<div class="row"><span class="spin"></span><span class="muted">'+t("labBusyEval")+"</span></div>";$("evQuick").disabled=true;
  try{const d=await post("/api/lab/eval",{items:pick,full:false});$("evLive").innerHTML='<div class="evleg"><span class="h">Hit@5</span><span class="m">MRR</span><span>n = '+pick.length+"</span></div>"+evChart(d.retrieval)}
  catch(e){$("evLive").innerHTML='<span class="badge bad">'+esc(e.message)+"</span>"}finally{$("evQuick").disabled=false}};
window.onLang=()=>{loadLib();$("evSaved").innerHTML=evChart(SAVED);evInfo()};
</script>
</body>
</html>
